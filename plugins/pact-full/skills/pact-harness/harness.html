<title>__TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* withpact.com product mocks: neutral, near-monochrome, soft cards, black pills */
  --bg:#f5f5f3; --surface:#ffffff; --surface-2:#f1f1ef; --ink:#121317; --ink-2:#5c606b; --ink-3:#8b909b; --line:#ebebea;

  --a:#1f8a5b; --a-soft:#e3f5ec; --r:#9a6b00; --r-soft:#fdf3d7; --warn:#c2412d; --warn-soft:#fde8e3; --focus:#4152d6;
  --shadow:0 1px 2px rgb(0 0 0 / .04),0 8px 24px -12px rgb(0 0 0 / .10);
  --body:"Inter",ui-sans-serif,system-ui,"Segoe UI",sans-serif; --mono:ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){color-scheme:dark;
  --bg:#0f1012; --surface:#18191c; --surface-2:#222327; --ink:#f2f2f0; --ink-2:#a9adb6; --ink-3:#7b808a; --line:#2a2b30;
  --head:#f2f2f0; --p:#8f9bff; --p-hover:#aab3ff; --p-soft:#20234a; --navy:#0a266c; --cta:#f2f2f0; --cta-ink:#121317;
  --logo-word:#c2d1fd; --logo-mark:#8f9bff;
  --a:#4cc596; --a-soft:#15302a; --r:#f3c35a; --r-soft:#33291a; --warn:#f08a74; --warn-soft:#3a221e; --focus:#8f9bff;
  --shadow:0 1px 2px rgb(0 0 0 / .3)}}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#0f1012; --surface:#18191c; --surface-2:#222327; --ink:#f2f2f0; --ink-2:#a9adb6; --ink-3:#7b808a; --line:#2a2b30;
  --head:#f2f2f0; --p:#8f9bff; --p-hover:#aab3ff; --p-soft:#20234a; --navy:#0a266c; --cta:#f2f2f0; --cta-ink:#121317;
  --logo-word:#c2d1fd; --logo-mark:#8f9bff;
  --a:#4cc596; --a-soft:#15302a; --r:#f3c35a; --r-soft:#33291a; --warn:#f08a74; --warn-soft:#3a221e; --focus:#8f9bff;
  --shadow:0 1px 2px rgb(0 0 0 / .3)}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--body);margin:0;-webkit-font-smoothing:antialiased}
.wrap{max-width:920px;margin:0 auto;padding:16px 16px 48px}
h1{font-size:22px;margin:0;line-height:1.15;font-weight:500;color:var(--head);letter-spacing:-.01em}
h2{font-size:15px;margin:0;font-weight:600;color:var(--head)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.mono{font-family:var(--mono);font-size:11.5px}
.dim{color:var(--ink-3)}
.top{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between}
.ctl{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--surface-2);border-radius:8px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:5px 10px;border-radius:6px;cursor:pointer;font-size:13px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--p);font-weight:600;box-shadow:0 1px 2px rgb(16 36 99 / .12)}
.btn{border:1px solid var(--p);background:var(--surface);color:var(--p);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:13px;font-weight:500}
.btn:hover{border-color:var(--p-hover);color:var(--p-hover)}
.btn.pri{background:var(--p);color:#fff;border-color:var(--p);box-shadow:0 4px 6px -1px rgb(16 36 99 / .18),0 2px 4px -2px rgb(16 36 99 / .12)}
.btn.pri:hover{background:var(--p-hover);border-color:var(--p-hover);color:#fff}
.btn.pri.arm{background:var(--warn);border-color:var(--warn)}
.btn:disabled{opacity:.5;cursor:default}
.fresh{font-size:12px;color:var(--ink-3);margin-top:3px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{height:34px;width:auto;flex:none}
.logo .w{fill:var(--logo-word)} .logo .m{fill:var(--logo-mark)}
.brand-sep{width:1px;height:30px;background:var(--line);flex:none}
@media (max-width:420px){.logo{height:26px}.brand{gap:8px}.brand-sep{height:24px}}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:14px 0 12px;padding-bottom:2px}
.tab{all:unset;cursor:pointer;flex:1 0 auto;min-width:88px;padding:10px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line);display:grid;gap:1px}
.tab[aria-selected="true"]{background:var(--p-soft);border-color:var(--p)}
.tab:focus-visible{outline:2px solid var(--focus)}
.tab b{font-size:20px;line-height:1;font-weight:600;color:var(--head)}
.tab[aria-selected="true"] b{color:var(--p)}
.tab span{font-size:12px;color:var(--ink-2);font-weight:600}
.panel{display:grid;gap:12px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.box-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.row{display:grid;grid-template-columns:minmax(0,max-content) minmax(0,1fr) auto;gap:8px;align-items:baseline;padding:7px 12px;border-bottom:1px solid var(--line);font-size:13px;cursor:pointer}
.row:last-child{border-bottom:0}
.row:hover{background:var(--surface-2)}
.row .t{min-width:0;overflow-wrap:anywhere}
.row .s{font-size:12px;color:var(--ink-3);white-space:nowrap}
.k{font-family:var(--mono);font-size:10px;padding:1px 5px;border-radius:4px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap;display:inline-block;max-width:180px;overflow:hidden;text-overflow:ellipsis;vertical-align:baseline}
.who{overflow-wrap:anywhere}
.k.done{background:var(--a-soft);color:var(--a)} .k.blocked,.k.late{background:var(--warn-soft);color:var(--warn)}
.k.in_progress,.k.review{background:var(--p-soft);color:var(--p)} .k.note{background:var(--r-soft);color:var(--r)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.card{all:unset;box-sizing:border-box;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 12px;display:grid;gap:6px;align-content:start}
.card:hover{border-color:var(--p)} .card:focus-visible{outline:2px solid var(--focus)}
.card.late{border-left:4px solid var(--warn)}
.card .t{font-weight:600;font-size:13.5px;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:4px 8px;font-size:12px;color:var(--ink-2)}
.pbar{height:5px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--a)}
.banner{padding:10px 14px;border-radius:12px;background:var(--r-soft);color:var(--ink);font-size:13px}
.banner.err{background:var(--warn-soft)}
.empty{padding:14px 12px;color:var(--ink-3);font-size:13px}
.cl{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--line)}
.cl:last-child{border-bottom:0}
.cl .t{font-size:13px;overflow-wrap:anywhere;cursor:pointer}
.cl .ev{font-size:12px;color:var(--ink-3)}
.day{padding:6px 12px;font-size:11.5px;font-weight:700;color:var(--ink-3);background:var(--surface-2);text-transform:uppercase;letter-spacing:.04em}
.who{font-size:12px;color:var(--ink-3)}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none}
.scrim.on{display:block}
.dr{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--bg);border-left:1px solid var(--line);transform:translateX(100%);transition:transform .18s;overflow-y:auto;padding:14px 16px 40px;display:flex;flex-direction:column;gap:10px}
.dr.on{transform:none}
.dr>*{flex:none}
.dr pre{white-space:pre-wrap;font:12.5px/1.5 var(--body);margin:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;overflow-wrap:anywhere}
/* ported from /harness: date boxes, timeline, theme groups, people */
.hrow{display:flex;gap:10px;align-items:center}
.date{display:grid;place-items:center;min-width:44px;padding:4px 6px;border-radius:8px;background:var(--surface-2);line-height:1.05;text-align:center;flex:none}
.date b{font-size:18px}
.date span{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3)}
.date.late{background:var(--warn-soft)} .date.late b,.date.late span{color:var(--warn)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:11px;padding:2px 7px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap;font-weight:500}
.chip.late{background:var(--warn-soft);color:var(--warn)} .chip.go{background:var(--p-soft);color:var(--p)} .chip.ok{background:var(--a-soft);color:var(--a)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;background:var(--a);flex:none}
.dot.warn{background:var(--warn)}
.av{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;font-size:10.5px;font-weight:700;background:var(--surface-2);color:var(--ink-2);border:2px solid var(--surface);flex:none}
.av.pact{background:var(--p-soft);color:var(--p)}
.avs{display:flex}.avs .av+.av{margin-left:-6px}
.spread{display:flex;gap:8px;align-items:center;justify-content:space-between}
.tl{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 12px 6px;overflow-x:auto}
.tl-in{min-width:520px;display:grid;grid-template-columns:140px 1fr;row-gap:3px;font-size:12px}
.tl-l{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-2);padding-right:8px;line-height:20px}
.tl-t{position:relative;height:20px;border-bottom:1px dashed var(--line)}
.tl-t .pt{position:absolute;top:5px;width:10px;height:10px;border-radius:50%;background:var(--p);transform:translateX(-5px)}
.tl-t .pt.late{background:var(--warn)}
.tl-t .pt.edge{border-radius:2px;width:6px;transform:none}
.tl-today{position:absolute;top:0;bottom:0;width:2px;background:var(--ink);opacity:.5}
.tl-ax{position:relative;height:18px;font-size:10.5px;color:var(--ink-3)}
.tl-ax span{position:absolute;transform:translateX(-50%)}
.agrp{display:grid;gap:8px}
.agrp-h{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;padding:6px 10px;border-radius:8px;background:var(--a-soft)}
.agrp-h b{color:var(--a)} .agrp-h.warn{background:var(--warn-soft)} .agrp-h.warn b{color:var(--warn)}
.agrp-h:focus-visible{outline:2px solid var(--focus)}
.card.tint{border-left:4px solid var(--a)} .card.tint.warn{border-left-color:var(--warn)}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.trio div{display:grid;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px}
.trio b{font-size:22px} .trio b.w{color:var(--warn)}
.trio span{font-size:11px;color:var(--ink-3)}
.eb{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);font-weight:600}
.dbox{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:4px;font-size:13.5px}
.dbox.warn{background:var(--warn-soft);border-color:transparent} .dbox.warn .eb{color:var(--warn)}
.dbox ol{margin:0;padding-left:18px;display:grid;gap:2px}
.dr h3{font-size:13px;color:var(--ink-3);margin:6px 0 0}
.sumline{font-size:14px;line-height:1.5}
.crumb{all:unset;cursor:pointer;font-size:13px;color:var(--ink-2);overflow-wrap:anywhere}
.crumb:hover b{color:var(--p)} .crumb:focus-visible{outline:2px solid var(--focus)}
.dbox ul.tight{margin:0;padding-left:18px;display:grid;gap:3px}
.mini{display:grid;gap:2px;margin-top:4px}
.mrow{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:baseline;padding:4px 2px;border-radius:6px;font-size:13.5px;overflow-wrap:anywhere}
.mrow:hover{background:var(--surface-2)} .mrow:focus-visible{outline:2px solid var(--focus)}
.dot.go{background:var(--p)} .dot.idle{background:var(--ink-3)}
details.agent>summary{cursor:pointer;list-style:none;flex-wrap:wrap} details.agent>summary::-webkit-details-marker{display:none}
details.agent>summary h2::before{content:"▸ ";color:var(--ink-3)} details.agent[open]>summary h2::before{content:"▾ "}
.agent-in{display:grid;gap:10px;padding:10px 12px}
@media (max-width:560px){
  .wrap{padding:12px 12px 40px}
  .dr{padding:76px 12px 32px;border-left:0}
  .row{grid-template-columns:minmax(0,max-content) minmax(0,1fr);row-gap:2px}
  .row .s{grid-column:2;white-space:normal;text-align:left}
  .cl{grid-template-columns:1fr}
  .cl .btn{justify-self:start}
  .trio b{font-size:18px}
  h1{font-size:19px}
}
.md{font-size:13.5px;line-height:1.5;overflow-wrap:anywhere}
.md p{margin:0 0 8px} .md p:last-child{margin-bottom:0}
.md h4{font-size:13.5px;margin:10px 0 4px} .md h4:first-child{margin-top:0}
.md ul,.md ol{margin:0 0 8px;padding-left:20px;display:grid;gap:2px}
.md code{font-family:var(--mono);font-size:12px;background:var(--surface-2);padding:0 4px;border-radius:4px}
.md a{color:var(--p)}
.nt{padding:10px 12px;border-bottom:1px solid var(--line);display:grid;gap:4px}
.nt:last-child{border-bottom:0}
.row>.k{align-self:start}
.rico{display:inline-block;width:1.2em;text-align:center;color:var(--p)}
select.btn{padding:4px 8px}
.ta{width:100%;font:13.5px/1.45 var(--body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;resize:vertical}
.srow{display:grid;gap:4px;padding:9px 12px;border-bottom:1px solid var(--line)}
.srow:last-child{border-bottom:0}
button.chip.src{border:0;cursor:pointer;font-size:12px;padding:3px 9px}
button.chip.src:hover{background:var(--p-soft);color:var(--p)}
.clamp{font-size:13px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere;white-space:pre-wrap}
.skel{height:14px;border-radius:6px;background:var(--surface-2);margin:10px 12px}

/* ---------- skin: withpact.com mocks ---------- */
.box,.card,.dbox,.trio div{border-radius:20px;border-color:var(--line);box-shadow:var(--shadow)}
.dbox{border-radius:16px}
.box-h{border-bottom:0;padding:14px 16px 6px}
.box-h h2{font-size:15px;font-weight:600}
.btn{border-radius:999px;border:1px solid var(--line);color:var(--ink);background:var(--surface);padding:7px 14px;font-weight:500}
.btn:hover{border-color:var(--ink-3);color:var(--ink)}
.btn.pri{background:var(--cta);color:var(--cta-ink);border-color:var(--cta);box-shadow:none}
.btn.pri:hover{background:var(--cta);color:var(--cta-ink);opacity:.88}
.btn.pri.arm{background:var(--warn);border-color:var(--warn);color:#fff}
.tabs{gap:8px;margin:14px 0 14px}
.tab{flex:0 0 auto;min-width:0;display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.tab span{font-size:13px;color:var(--ink);font-weight:500}
.tab b{font-size:12px;font-weight:600;color:var(--ink-3);background:var(--surface-2);border-radius:999px;padding:1px 7px;line-height:1.5}
.tab[aria-selected="true"]{background:var(--cta);border-color:var(--cta)}
.tab[aria-selected="true"] span{color:var(--cta-ink)} .tab[aria-selected="true"] b{background:rgb(255 255 255 / .16);color:var(--cta-ink)}
.k{font-family:var(--body);font-size:11px;font-weight:500;border-radius:999px;padding:2px 8px}
.chip{border-radius:999px;font-size:12px;padding:3px 10px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:500;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.pill.risk{background:var(--r-soft);color:var(--r)} .pill.ok{background:var(--a-soft);color:var(--a)} .pill.bad{background:var(--warn-soft);color:var(--warn)}
.sd{width:7px;height:7px;border-radius:50%;background:var(--ink-3);display:inline-block;flex:none}
.sd.blocked{background:#e2a400} .sd.in_progress,.sd.review{background:var(--p)} .sd.done{background:var(--a)} .sd.cancelled{background:var(--ink-3)} .sd.late{background:var(--warn)}
/* item rows, as in the Daily brief mock */
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;margin:0 10px 8px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--surface);cursor:pointer}
.item:first-of-type{margin-top:4px}

.eyebrow{font-size:12.5px;color:var(--ink-3);font-weight:500}

</style>

<div class="wrap">

<script>
// The template's version. The page compares it with what the Pact server serves
// (`harness_template`) and offers a one-click self-update when the server's is newer.
const HARNESS_VERSION = "2026.10.02.1";
// Filled in when the page is built (by /harness, or by the page's own update):
// one entry per Pact connector; key = project name (from whoami), server = the
// connector's display name.
const PROJECTS = __PROJECTS__;
// Page options: {add: show the "+" that asks Claude to add a project}.
const OPTIONS = __OPTIONS__;
const TABS = [["myday","Daily brief"],["activity","Activity"],["projects","Projects"],["themes","Themes"],["people","Resources"],["archive","Archive"]];
const CLOSED = new Set(["done","cancelled"]);
const TODAY = new Date().toISOString().slice(0,10);

const $ = s => document.querySelector(s);
const store = {get(k){try{return localStorage.getItem(k)}catch{return null}}, set(k,v){try{localStorage.setItem(k,v)}catch{}}};
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function unent(s){return String(s??"").replace(/&amp;/g,"&").replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&quot;/g,'"').replace(/&#39;/g,"'")}
function fmtDay(iso){if(!iso)return"";const d=new Date(iso.length===10?iso+"T12:00:00":iso);return d.toLocaleDateString(undefined,{month:"short",day:"numeric"})}
function fmtTime(iso){const d=new Date(iso);return isNaN(d)?"":d.toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit"})}
function ago(ms){const m=Math.round((Date.now()-ms)/60000);return m<1?"just now":m<60?m+" min ago":Math.round(m/60)+" h ago"}
function short(name){return (name||"").replace(/^beads-mcp:/,"")}

let state = {project: store.get("hs.project") || Object.keys(PROJECTS)[0], tab: store.get("hs.tab") || "myday"};
if(!PROJECTS[state.project]) state.project = Object.keys(PROJECTS)[0];
let mcp = null, data = null, loadSeq = 0;

/* ---------- parsing the connector's markdown ---------- */
const LINE = /^- \S+ \*\*(PACT-\d+)(?: · ([^*]+?))?\*\* — (.*) \((not_started|in_progress|blocked|review|done|cancelled), R: (.*?) · A: (.*?)(?:, due (\d{4}-\d{2}-\d{2}))?\)\s*$/;
function parseList(text){
  const out=[];
  for(const l of String(text||"").split("\n")){
    const m=l.match(LINE); if(!m) continue;
    out.push({id:m[1],alias:m[2]||"",title:unent(m[3]),status:m[4],assignee:m[5],approver:m[6],due:m[7]||null});
  }
  return out;
}
const CHILD = /^\s+- \S+ (PACT-\d+)(?: · (\S+))? — (.*) \((not_started|in_progress|blocked|review|done|cancelled)\)\s*$/;
function splitNotes(body){
  return String(body||"").replace(/\n\s*_…[^\n]*_\s*$/,"").split(/\n(?=- \[\d{4}-\d{2}-\d{2}\] )/)
    .map(c=>c.match(/^\s*- \[(\d{4}-\d{2}-\d{2})\] (\S+): ([\s\S]*)$/)).filter(Boolean)
    .map(m=>({date:m[1],who:m[2],text:m[3].trim()}));
}
function parseBead(text){
  const t=String(text||""); const children=[], parents=[]; let mode=null;
  const type=(t.match(/^## \[(\w+)\]/m)||[])[1]||"";
  for(const l of t.split("\n")){
    if(/^- \*\*⬆ Blocked by/.test(l)){mode="c";continue}
    if(/^- \*\*⬇ Blocking/.test(l)){mode="p";continue}
    if(/^- \*\*/.test(l)||/^#/.test(l)){mode=null;continue}
    const m=l.match(CHILD);
    if(m&&mode){(mode==="c"?children:parents).push({id:m[1],alias:m[2]||"",title:unent(m[3]),status:m[4]})}
  }
  const notes=splitNotes((t.split(/^### Notes.*$/m)[1]||"").split(/^###\s/m)[0]);
  return {type:type.toLowerCase(),children,parents,notes};
}

/* ---------- connector calls ---------- */
function errText(e, server){
  const c=e&&e.code;
  if(c==="server_not_connected") return `Add ${server} in claude.ai Settings → Connectors.`;
  if(c==="needs_reauth") return `Reconnect ${server} in claude.ai Settings → Connectors.`;
  if(c==="not_in_manifest") return `${server} isn't allowed for this page.`;
  if(c==="selection_required") return `Pick which ${server} connector to use when claude.ai asks.`;
  return (e&&e.message)||"The connector didn't answer.";
}
async function call(tool,input,fresh){
  const r=await mcp.callTool(PROJECTS[state.project].server,tool,input,{cache:{staleTime:fresh?0:120000,gcTime:3600000,refresh:!!fresh}});
  return r;
}
async function pool(items,n,fn){
  const out=new Array(items.length); let i=0;
  await Promise.all(Array.from({length:Math.min(n,items.length)},async()=>{while(i<items.length){const k=i++;try{out[k]=await fn(items[k])}catch(e){out[k]=null}}}));
  return out;
}

/* Stale-while-revalidate over watchTool: resolves at once with whatever the
   shell has cached (up to a day old), then hands any newer result to onFresh.
   Falls back to a plain call on shells without watchTool. */
function swr(tool,input,onFresh){
  const server=PROJECTS[state.project].server;
  return new Promise((res,rej)=>{
    let firstEv=true, un=null, done=false;
    const stop=()=>{ if(!done){done=true; setTimeout(()=>un&&un(),0)} };
    try{
      un=mcp.watchTool(server,tool,input,ev=>{
        if(ev.type==="error"){
          if(firstEv){ firstEv=false; stop();
            if(["bad_request","capability_removed","capability_disabled"].includes(ev.error?.code)) call(tool,input,false).then(res,rej); else rej(ev.error); }
          return;
        }
        const r=ev.result;
        if(firstEv){ firstEv=false; res(r); if(!(r.cache&&r.cache.revalidating)) stop(); return; }
        stop(); onFresh&&onFresh(r);
      },{cache:{staleTime:60000,gcTime:86400000}});
    }catch(e){ call(tool,input,false).then(res,rej); }
  });
}
let RAW=null, rebuildTimer=null;
const R_sources=keep=>RAW&&RAW.sources!==undefined?RAW.sources:keep;
function rebuild(seq){
  if(seq!==loadSeq||!RAW) return;
  clearTimeout(rebuildTimer);
  rebuildTimer=setTimeout(()=>{
    if(seq!==loadSeq) return;
    const goals=RAW.goals.map(g=>({...g,...(RAW.details.get(g.id)||{children:[],parents:[],notes:[],type:""})}));
    const keepSources=data&&data.project===RAW.proj?data.sources:undefined;
    data=shape(RAW.proj,goals,RAW.open,RAW.doneGoals,RAW.history,RAW.historyErr,RAW.storedAt);
    data.sources=R_sources(keepSources);
    data.pending=RAW.goals.length-RAW.details.size;
    data.myday=myDay(data,RAW.me);
    render();
  },60);
}
async function load(fresh){
  const seq=++loadSeq; const proj=state.project; const server=PROJECTS[proj].server;
  $("#title").textContent="Management Harness";
  $("#fresh").textContent="Loading from "+server+"…";
  if(!data||data.project!==proj){ $("#panel").innerHTML='<div class="box">'+'<div class="skel"></div>'.repeat(6)+'</div>'; $("#tabs").innerHTML=""; }
  const get=(tool,input,apply)=>fresh?call(tool,input,true):swr(tool,input,r=>{ if(seq===loadSeq&&RAW){ apply(r); rebuild(seq); } });
  RAW={proj,goals:[],open:[],doneGoals:[],details:new Map(),history:null,historyErr:null,me:null,storedAt:Date.now()};
  const R=RAW;
  const setGoals=r=>{R.goals=parseList(r.payload)}, setOpen=r=>{R.open=parseList(r.payload);R.storedAt=r.cache?.storedAt||Date.now()}, setDone=r=>{R.doneGoals=parseList(r.payload)};
  const setMe=r=>{R.me=(String(r.payload||"").match(/Connected as `([^`]+)`/)||[])[1]||null};
  const setHist=r=>{R.history=(r.payload&&r.payload.items)||[];R.historyErr=null};
  const side=[
    get("whoami",{},setMe).then(setMe).catch(()=>{}),
    get("list_history",{days:14,limit:400},setHist).then(setHist).catch(e=>{R.historyErr=e}),
  ];
  try{
    const [g,o,d]=await Promise.all([
      get("list_goals",{include_milestones:true},setGoals),
      get("list_beads",{},setOpen),
      get("list_goals",{include_milestones:true,status:"done"},setDone),
    ]);
    setGoals(g); setOpen(o); setDone(d);
  }catch(e){
    if(seq!==loadSeq) return;
    $("#fresh").textContent="";
    $("#panel").innerHTML=`<div class="banner err">${esc(errText(e,server))}</div>`;
    return;
  }
  if(seq!==loadSeq) return;
  await Promise.race([Promise.all(side),new Promise(r=>setTimeout(r,400))]);
  rebuild(seq);
  Promise.all(side).then(()=>rebuild(seq));
  loadSources(fresh,seq);
  await pool(R.goals.slice(),8,g=>{
    const apply=r=>{R.details.set(g.id,parseBead(r.payload))};
    return get("get_bead",{bead_id:g.id,notes_limit:1},apply).then(r=>{ if(seq===loadSeq){apply(r);rebuild(seq)} });
  });
}

/* ---------- My day: what matters to the viewer today ---------- */
const DAY=864e5;
const daysBetween=(a,b)=>Math.round((new Date(b+"T12:00:00")-new Date(a+"T12:00:00"))/DAY);
const first=n=>String(n||"").split(/\s+/)[0];
function resolveMe(d,dev){
  const names=new Set(); for(const b of d.open){names.add(b.assignee);names.add(b.approver)}
  const real=[...names].filter(n=>n&&n!=="unassigned"&&n!=="—");
  const saved=store.get("hs.me."+d.project); if(saved&&real.includes(saved)) return {name:saved,names:real};
  const k=String(dev||"").toLowerCase().replace(/^beads-mcp:/,"");
  const hit=k&&(real.find(n=>n.toLowerCase()===k)||real.find(n=>first(n).toLowerCase()===k)||real.find(n=>n.toLowerCase().replace(/\s+/g,"").includes(k)));
  return {name:hit||null,names:real.sort()};
}
function myDay(d,dev){
  const who=resolveMe(d,dev); const me=who.name;
  const out={me,names:who.names,count:0,overdue:[],soon:[],review:[],blocked:[],justDone:[],recs:[]};
  if(!me) return out;
  const mine=b=>b.assignee===me, iApprove=b=>b.approver===me;
  const weekOut=new Date(Date.now()+7*DAY).toISOString().slice(0,10);
  out.overdue=d.open.filter(b=>mine(b)&&b.due&&b.due<TODAY).sort((a,b)=>a.due.localeCompare(b.due));
  out.soon=d.open.filter(b=>mine(b)&&b.due&&b.due>=TODAY&&b.due<=weekOut).sort((a,b)=>a.due.localeCompare(b.due));
  out.review=d.open.filter(b=>iApprove(b)&&!mine(b)&&b.status==="review");
  out.blocked=d.open.filter(b=>(mine(b)||iApprove(b))&&b.status==="blocked");
  const parentOf=new Map(); for(const g of d.goals) for(const c of g.children) if(!parentOf.has(c.id)) parentOf.set(c.id,g);
  const since3=new Date(Date.now()-3*DAY).toISOString();
  const seen=new Set();
  for(const e of (d.feed||[])){
    const to=e.changes?.status?.to; if(to!=="done"||String(e.timestamp)<since3) continue;
    const id=(e.bead_id||"").replace("BEAD-","PACT-"); if(seen.has(id)) continue; seen.add(id);
    const g=parentOf.get(id); const item=d.byId.get(id)||{};
    const relevant=!g||g.assignee===me||g.approver===me||item.assignee===me||item.approver===me||short(e.changed_by).toLowerCase()===String(dev||"").toLowerCase();
    if(relevant) out.justDone.push({id,title:e.title||item.title||"",when:e.timestamp,by:short(e.changed_by),goal:g||null});
  }
  // recommended actions — deterministic rules over the board
  const R=out.recs;
  for(const g of d.closeCands) if(g.assignee===me||g.approver===me)
    R.push({kind:"close",id:g.id,title:`${g.id} looks ready to close`,why:g.evidence,approve:g.id});
  const byPerson=new Map();
  for(const j of out.justDone){const g=j.goal; if(!g) continue; for(const who of [g.approver,g.assignee]){ if(!who||who===me||who==="unassigned"||who==="—") continue; if(!byPerson.has(who)) byPerson.set(who,[]); byPerson.get(who).push(j); break; }}
  for(const [who,js] of byPerson){
    const goals=[...new Set(js.map(j=>j.goal.title))];
    const g0=js[0].goal;
    const draft=`Hi ${first(who)} — quick update on ${goals.join(" and ")}:\n${js.map(j=>`• ${j.id} ${j.title} — closed`).join("\n")}\n${goals.length===1&&g0.total?`That puts it at ${g0.closed}/${g0.total} done.`:""}\nHappy to walk you through it.`;
    R.push({kind:"notify",to:who,draft,bead:js[0].id,title:`Tell ${first(who)} about recent progress`,why:`${js.length} closed under ${goals.join(", ")} — ${first(who)} is on ${goals.length>1?"those goals":"that goal"}.`,
      prompt:`Draft a short message to ${who} about recent progress: ${js.map(j=>`${j.id} "${j.title}" was closed`).join("; ")}. Say what it moves forward in ${goals.join(", ")} (read the goal with get_bead), keep it to 3–4 lines, and show me the draft before sending anything.`});
  }
  for(const b of out.overdue){const late=daysBetween(b.due,TODAY); if(late>=14) R.push({kind:"late",id:b.id,title:`${b.id} is ${late} days late`,why:b.title,
    prompt:`${b.id} "${b.title}" is ${late} days past its due date (${b.due}). Read it with get_bead (full notes) and help me decide: reschedule to a realistic date, close it with its evidence, or cancel it. Propose one, don't change anything until I confirm.`});}
  for(const b of out.review) R.push({kind:"review",id:b.id,title:`${b.id} is waiting for your review`,why:`${b.title} — from ${first(b.assignee)}`,
    prompt:`${b.id} "${b.title}" is in review and I'm the approver. Read it with get_bead (full notes) and summarize what was delivered against its acceptance criteria, so I can approve or send it back.`});
  for(const b of out.blocked) R.push({kind:"blocked",id:b.id,title:`Unblock ${b.id}`,why:`${b.title} — ${b.assignee===me?"yours":"you approve it"}`,
    prompt:`${b.id} "${b.title}" is blocked. Read its notes with get_bead and tell me what it's waiting on, who can unblock it, and draft the one message that would move it.`});
  const myUnfiled=d.unfiled.filter(mine);
  if(myUnfiled.length) R.push({kind:"link",title:`Link ${myUnfiled.length} of your task${myUnfiled.length>1?"s":""} to a goal`,why:myUnfiled.slice(0,3).map(b=>b.id).join(", ")+(myUnfiled.length>3?"…":""),
    prompt:`These open tasks of mine aren't under any goal: ${myUnfiled.map(b=>`${b.id} "${b.title}"`).join("; ")}. Propose which goal each one belongs under (list_goals), and link them only after I confirm.`});
  out.count=out.overdue.length+out.review.length+R.length;
  return out;
}
function myDayHTML(d){
  const m=d.myday||{names:[]};
  const pick=`<select id="mepick" class="btn" aria-label="Who are you">${['<option value="">Who are you?</option>',...m.names.map(n=>`<option ${n===m.me?"selected":""}>${esc(n)}</option>`)].join("")}</select>`;
  if(!m.me) return `<div class="banner">Pick your name to see your brief. ${pick}</div>`;
  const risk=m.overdue.length+m.blocked.length;
  let h=`<div class="brief-h"><div><div class="eyebrow">Pact AI · ${esc(first(m.me))} · ${esc(fmtDay(TODAY))}</div><h2 class="brief-t">Daily brief</h2></div><div class="ctl">${risk?`<span class="pill risk">${risk} at risk</span>`:`<span class="pill ok">on track</span>`}${pick}</div></div>`;

  const atRisk=[...m.overdue.map(b=>({b,why:`${daysBetween(b.due,TODAY)}d late`,cls:"late"})),...m.blocked.filter(b=>!m.overdue.includes(b)).map(b=>({b,why:"Blocked",cls:"blocked"}))];
  if(atRisk.length) h+=`<div class="box"><div class="box-h"><h2>At risk</h2><span class="pill risk">${atRisk.length}</span></div>${atRisk.map(x=>rowHTML(x.b,undefined,x.why)).join("")}</div>`;
  h+=`<div class="box"><div class="box-h"><h2>Suggested follow-ups</h2><span class="dim">${m.recs.length}</span></div>${m.recs.length?m.recs.map((r,i)=>`<div class="rec"><div ${r.id?`data-id="${esc(r.id)}" style="cursor:pointer"`:""}><div class="rt">${esc(r.title)}</div><div class="rsub">${esc(r.why)}</div></div>${r.approve?`<button class="btn pri" data-approve="${esc(r.approve)}" type="button">Approve close</button>`:r.kind==="notify"?`<button class="btn pri" data-notify="${i}" type="button">Start follow-up</button>`:`<button class="btn" data-ask="${i}" type="button">Ask Claude</button>`}</div>`).join(""):'<div class="empty">Nothing needs you right now.</div>'}</div>`;
  if(m.review.length) h+=`<div class="box"><div class="box-h"><h2>Waiting on your review</h2><span class="dim">${m.review.length}</span></div>${m.review.map(b=>rowHTML(b,undefined,"In review")).join("")}</div>`;
  if(m.soon.length) h+=`<div class="box"><div class="box-h"><h2>Due this week</h2><span class="dim">${m.soon.length}</span></div>${m.soon.map(b=>rowHTML(b,`<small>Due</small><b>${esc(fmtDay(b.due))}</b>`)).join("")}</div>`;
  if(m.justDone.length) h+=`<div class="box"><div class="box-h"><h2>Just closed</h2><span class="dim">last 3 days</span></div>${m.justDone.map(j=>rowHTML({id:j.id,title:j.title,status:"done"},`<small>${esc(fmtDay(String(j.when)))}</small><b>${esc(first(j.by).replace(/^./,c=>c.toUpperCase()))}</b>`,"Done")).join("")}</div>`;
  else if(!d.feed) h+=`<div class="empty">"Just closed" needs the list_history tool on this project.</div>`;
  return h;
}
/* ---------- notify: start the conversation on whatever channel the viewer has ---------- */
// Filled in by the pact-harness skill: the display names of the viewer's Slack
// and Gmail connectors, or null for one they don't have.
const CHANNELS = __CHANNELS__;
let AVAIL=null;
async function channels(){
  if(AVAIL) return AVAIL;
  AVAIL=new Set();

/* ---------- sources: what the signal-graph pipelines ingested ---------- */
const SRC_DAYS=14;
function toolText(e){
  const r=e&&e.result; const c=r&&(r.content||r.result?.content);
  return String((e&&e.message)||"")+" "+(Array.isArray(c)?c.map(b=>b.text||"").join(" "):"");
}
function fenceJSON(t){const m=String(t||"").match(/```json\s*([\s\S]*?)```/);try{return m?JSON.parse(m[1]):[]}catch{return []}}
function platform(src){return (String(src||"Other").split(/[\s·:—-]+/)[0]||"Other")}
async function loadSources(fresh,seq){
  const proj=state.project;
  let pipes;
  try{ await call("graph_read",{kind:"runs",stage:"ingest",limit:1},fresh); pipes=[null]; }
  catch(e){
    const m=toolText(e).match(/more than one pipeline \(([^)]+)\)/);
    if(!m){ if(seq===loadSeq){ if(RAW) RAW.sources=[]; if(data){data.sources=[];if(state.tab==="activity")render()} } return; }
    pipes=m[1].split(",").map(x=>x.trim()).filter(Boolean);
  }
  const since=new Date(Date.now()-SRC_DAYS*864e5).toISOString();
  const out=await pool(pipes,3,async pipe=>{
    const base=pipe?{pipeline:pipe}:{};
    const runsTxt=String((await call("graph_read",{...base,kind:"runs",stage:"ingest",limit:500},fresh)).payload||"");
    const runs=[...runsTxt.matchAll(/`run_(\S+?)_ingest` · ingest · (\w+) · in:(\d+) out:(\d+)/g)].map(m=>({ts:m[1],status:m[2],out:+m[4]}));
    const total=runs.reduce((a,r)=>a+r.out,0);
    const win=runs.filter(r=>r.ts>=since); const winCount=win.reduce((a,r)=>a+r.out,0);
    let items=[];
    if(winCount){
      const r=await call("graph_read",{...base,kind:"raw",format:"full",limit:500,since_seq:Math.max(0,total-winCount-60)},fresh);
      items=fenceJSON(r.payload).filter(x=>{const m=String(x.run_id||"").match(/^run_(\S+?)_ingest/);return m&&m[1]>=since})
        .sort((a,b)=>String(b.occurred_at||"").localeCompare(String(a.occurred_at||"")));
    }
    return {pipeline:pipe,last:runs[0]||null,items};
  });
  if(seq!==loadSeq||state.project!==proj) return;
  if(RAW) RAW.sources=out.filter(Boolean);
  if(!data||data.project!==proj) return;
  data.sources=RAW?RAW.sources:out.filter(Boolean);
  if(state.tab==="activity") render();
}
function sourcesHTML(d){
  if(d.sources===undefined) return `<div class="box"><div class="box-h"><h2>Sources</h2><span class="dim">loading…</span></div></div>`;
  if(!d.sources.length) return "";
  const multi=d.sources.length>1;
  const rows=d.sources.map(p=>{
    const by={}; for(const it of p.items){const k=platform(it.source);by[k]=(by[k]||0)+1}
    const chips=Object.entries(by).sort((a,b)=>b[1]-a[1]).map(([k,n])=>`<button class="chip src" data-open="src:${esc(p.pipeline||"")}|${esc(k)}" type="button">${esc(k)} <b>${n}</b></button>`).join("");
    const last=p.last?`last ingest ${esc(fmtDay(p.last.ts))} ${esc(fmtTime(p.last.ts))}${p.last.status!=="ok"?` · <span class="k late">${esc(p.last.status)}</span>`:""}`:"never ingested";
    return `<div class="srow">${multi?`<span class="mono">${esc(p.pipeline)}</span>`:""}<span class="chips">${chips||'<span class="dim">nothing new</span>'}</span><span class="who">${last}</span></div>`;
  }).join("");
  const n=d.sources.reduce((a,p)=>a+p.items.length,0);
  return `<div class="box"><div class="box-h"><h2>Sources · ${SRC_DAYS} days</h2><span class="dim">${n} items ingested</span></div>${rows}</div>`;
}

      <div class="clamp">${esc(it.text||"")}</div>
      <div class="who">${it.status==="skipped"?`skipped${it.skip_reason?": "+esc(it.skip_reason):""}`:(it.signals||[]).length?`→ ${(it.signals||[]).length} signal${it.signals.length>1?"s":""} <span class="mono">${esc(it.signals.join(", "))}</span>`:esc(it.status||"")}</div>
    </div>`).join("")}</div>`).join("")}`);

/* ---------- shaping ---------- */
function shape(project,goals,open,doneGoals,history,historyErr,storedAt){
  const byId=new Map();
  for(const b of open) byId.set(b.id,b);
  for(const g of goals){ byId.set(g.id,{...byId.get(g.id),...g}); for(const c of g.children) if(!byId.has(c.id)) byId.set(c.id,c); for(const p of g.parents) if(!byId.has(p.id)) byId.set(p.id,p); }
  for(const g of doneGoals) if(!byId.has(g.id)) byId.set(g.id,g);
  const goalIds=new Set(goals.map(g=>g.id));
  const filed=new Set(); for(const g of goals) for(const c of g.children) filed.add(c.id);

  for(const g of goals){
    g.total=g.children.length; g.closed=g.children.filter(c=>CLOSED.has(c.status)).length;
    g.late=!!(g.due&&g.due<TODAY); g.openParents=g.parents.filter(p=>goalIds.has(p.id));
  }
  for(const g of goals){ g.full=g.title; g.title=shortTitle(g.title); }
  for(const g of doneGoals){ g.full=g.title; g.title=shortTitle(g.title); }
  const gById=new Map(goals.map(g=>[g.id,g]));
  for(const g of goals){
    g.open=g.children.filter(c=>!CLOSED.has(c.status)&&!goalIds.has(c.id)).map(c=>({...c,...(byId.get(c.id)||{}),status:c.status}));
    g.open.sort((a,b)=>(b.status==="blocked")-(a.status==="blocked")||(a.due||"9").localeCompare(b.due||"9"));
    g.blockedKids=g.open.filter(o=>o.status==="blocked").length;
    g.lateKids=g.open.filter(o=>o.due&&o.due<TODAY).length;
    g.attention=g.late||g.blockedKids>0||g.lateKids>0;
  }
  const rootOf=g=>{const seen=new Set();let x=g;while(x.openParents.length&&!seen.has(x.id)){seen.add(x.id);x=gById.get(x.openParents[0].id)||x;if(seen.has(x.id))break}return x};
  const projects=goals.filter(g=>g.due).sort((a,b)=>a.due.localeCompare(b.due));
  const roots=goals.filter(g=>!g.openParents.length);
  const subtree=g=>{const seen=new Set();const walk=x=>{for(const c of x.children){if(seen.has(c.id))continue;seen.add(c.id);const cg=gById.get(c.id);if(cg)walk(cg)}};walk(g);return [...seen].map(id=>byId.get(id)).filter(Boolean)};
  const themes=roots.map(g=>{
    const items=subtree(g);
    const projs=projects.filter(p=>rootOf(p).id===g.id);
    const tasks=items.filter(i=>!CLOSED.has(i.status)&&!goalIds.has(i.id)).map(i=>({...i,...(byId.get(i.id)||{})}));
    const attn=tasks.filter(o=>o.status==="blocked"||(o.due&&o.due<TODAY));
    return{...g,items,openItems:items.filter(i=>!CLOSED.has(i.status)),projs,tasks,attn,warn:attn.length>0||projs.some(p=>p.attention)};
  }).sort((a,b)=>b.projs.length-a.projs.length||b.tasks.length-a.tasks.length);
  const tasks=open.filter(b=>!goalIds.has(b.id));
  const unfiled=tasks.filter(b=>!filed.has(b.id));

  const people=new Map();
  for(const b of open){
    const who=b.assignee&&b.assignee!=="unassigned"&&b.assignee!=="—"?b.assignee:"Unassigned";
    const p=people.get(who)||{name:who,items:[],late:0,blocked:0,inprog:0};
    p.items.push(b); if(b.due&&b.due<TODAY)p.late++; if(b.status==="blocked")p.blocked++; if(b.status==="in_progress")p.inprog++;
    people.set(who,p);
  }
  const closeCands=goals.filter(g=>g.total>0&&g.closed===g.total).map(g=>({...g,evidence:`All ${g.total} child pact${g.total>1?"s":""} are closed: `+g.children.map(c=>`${c.id} (${c.status})`).join(", ")+"."}));

  let feed=null;
  if(history){
    feed=history.filter(h=>h.timestamp).map(h=>{const id=(h.bead_id||"").replace("BEAD-","PACT-");return {...h,title:(gById.get(id)||byId.get(id)||{}).title||""}});
  }
  const fallbackFeed=[];
  if(!history){ for(const g of goals) for(const n of g.notes||[]) fallbackFeed.push({bead_id:g.id,action:"note",timestamp:n.date,changed_by:n.who,reason:n.text,title:g.title,changes:{}}); fallbackFeed.sort((a,b)=>b.timestamp.localeCompare(a.timestamp)); }

  const res=new Map();
  const R=n=>{if(!n||n==="unassigned"||n==="—")return null;if(!res.has(n))res.set(n,{name:n,responsible:[],accountable:[],tasks:[],stuck:0});return res.get(n)};
  for(const g of goals){R(g.assignee)?.responsible.push(g);R(g.approver)?.accountable.push(g)}
  for(const t of tasks){const r=R(t.assignee);if(r){r.tasks.push(t);if(t.status==="blocked"||(t.due&&t.due<TODAY))r.stuck++}}
  const resources=[...res.values()].sort((a,b)=>(b.responsible.length+b.tasks.length)-(a.responsible.length+a.tasks.length));
  for(const r of resources) r.tasks.sort((a,b)=>(a.due||"9").localeCompare(b.due||"9"));

  return {project,goals,gById,open,doneGoals,projects,themes,tasks,unfiled,resources,people:[...people.values()].sort((a,b)=>b.items.length-a.items.length),closeCands,feed,fallbackFeed,historyErr,storedAt,byId};
}

function status(s){return `<span class="k ${esc(s)}">${esc((s||"").replace("_"," "))}</span>`}
const STL2={not_started:"Not started",in_progress:"In progress",blocked:"Blocked",review:"In review",done:"Done",cancelled:"Cancelled"};

function describe(h){
  const c=h.changes||{};
  if(h.action==="created") return "created";
  if(h.action==="note") return "note";
  if(h.action==="deleted") return "deleted";
  const st=v=>{v=String(v||"").replace(/_/g," ");return v.length>14?"…":v};
  if(c.status) return `${st(c.status.from)} → ${st(c.status.to)}`;
  const keys=Object.keys(c); return keys.length?"changed "+keys.join(", "):h.action||"change";
}
function activityHTML(d){

  let day="";
  for(const e of feed.slice(0,250)){

    const what=describe(e); const cls=e.action==="note"?"note":(e.changes?.status?.to||"");

  }
  return h+`</div>`;

const MES=["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec"];
const dd=d=>d?+d.slice(8,10):"—", mm=d=>d?MES[+d.slice(5,7)-1]:"no date";
const dateBox=d=>`<div class="date ${d&&d<TODAY?"late":""}"><b>${dd(d)}</b><span>${mm(d)}</span></div>`;
const initials=n=>(n||"?").split(/\s+/).filter(Boolean).map(x=>x[0]).slice(0,2).join("").toUpperCase();
const av=(n,cls="")=>`<span class="av ${cls}" title="${esc(n||"Unassigned")}">${esc(initials(n))}</span>`;
const STL={not_started:"Not started",in_progress:"In progress",blocked:"Blocked",review:"In review",done:"Done",cancelled:"Cancelled"};
const STC={in_progress:"go",blocked:"late",review:"ok",done:"ok"};
const chipSt=s=>`<span class="chip ${STC[s]||""}">${STL[s]||esc(s)}</span>`;
const HORIZONS=[["15d","Next 15 days",15],["3m","Next 3 months",92],["all","Everything",null]];
let HZ=store.get("hs.hz")||"3m"; if(!HORIZONS.some(h=>h[0]===HZ)) HZ="3m";
const addDays=(iso,n)=>{const d=new Date(iso+"T12:00:00");d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
function timeline(rows,days){
  rows=rows.filter(p=>p.due); if(!rows.length) return "";
  const ds=rows.map(p=>p.due).concat([TODAY]).sort();
  let a,b;
  if(days){ // a fixed window: a little of the past (overdue gets pinned to the edge), then the horizon
    a=addDays(TODAY,-Math.max(3,Math.round(days*.25))); b=addDays(TODAY,days+Math.max(1,Math.round(days*.05)));
  } else { a=addDays(ds[0],-10); b=addDays(ds[ds.length-1],15); }
  const t0=new Date(a+"T00:00:00"), t1=new Date(b+"T00:00:00"), span=t1-t0;
  const pos=d=>Math.max(0,Math.min(100,(new Date(d+"T00:00:00")-t0)/span*100));
  const x=d=>pos(d).toFixed(2)+"%";

/* ---------- get_bead markdown → structured detail ---------- */
function inlineMd(t){
  let h=esc(unent(t));
  h=h.replace(/`([^`]+)`/g,'<code>$1</code>');
  h=h.replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
  h=h.replace(/(^|[\s(])_([^_]+)_(?=[\s).,]|$)/g,'$1<i>$2</i>');
  h=h.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  h=h.replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g,'$1<a href="$2" target="_blank" rel="noopener">$2</a>');
  return h;
}
function blockMd(text){
  const out=[]; let list=null, para=[];
  const flushP=()=>{if(para.length){out.push(`<p>${para.map(inlineMd).join("<br>")}</p>`);para=[]}};
  const flushL=()=>{if(list){out.push(`<${list.tag}>${list.items.map(i=>`<li>${inlineMd(i)}</li>`).join("")}</${list.tag}>`);list=null}};
  for(const raw of String(text).split("\n")){
    const l=raw.trimEnd(); let m;
    if(!l.trim()){flushP();flushL();continue}
    if((m=l.match(/^#{1,6}\s+(.*)/))){flushP();flushL();out.push(`<h4>${inlineMd(m[1])}</h4>`);continue}
    if((m=l.match(/^\s*[-*•]\s+(.*)/))){flushP();if(!list||list.tag!=="ul"){flushL();list={tag:"ul",items:[]}}list.items.push(m[1]);continue}
    if((m=l.match(/^\s*\d+[.)]\s+(.*)/))){flushP();if(!list||list.tag!=="ol"){flushL();list={tag:"ol",items:[]}}list.items.push(m[1]);continue}
    if(list&&/^\s{2,}\S/.test(raw)){list.items[list.items.length-1]+=" "+l.trim();continue}
    flushL();para.push(l);
  }
  flushP();flushL();
  return out.join("");
}
function beadHTML(text){
  const t=String(text||"");
  if(!/^## \[/m.test(t)) return `<div class="dbox">${blockMd(t)}</div>`;
  const lines=t.split("\n");
  const fields=[], parts={c:[],p:[]}; let mode=null, i=1;
  for(;i<lines.length;i++){
    const l=lines[i];
    if(/^###\s/.test(l)) break;
    let m;
    if(/^- \*\*⬆ Blocked by/.test(l)){mode="c";continue}
    if(/^- \*\*⬇ Blocking/.test(l)){mode="p";continue}
    if((m=l.match(CHILD))&&mode){parts[mode].push({id:m[1],alias:m[2]||"",title:unent(m[3]),status:m[4]});continue}
    if((m=l.match(/^- \*\*(.+?)\*\*:\s*(.*)$/))){mode=null;fields.push([m[1],m[2]]);continue}
  }
  const sections=[]; let cur=null;
  for(;i<lines.length;i++){
    const m=lines[i].match(/^###\s+(.*)/);
    if(m){cur={title:m[1],body:[]};sections.push(cur);continue}
    if(cur) cur.body.push(lines[i]);
  }
  const f=Object.fromEntries(fields.map(([k,v])=>[k.toLowerCase(),v]));
  const stat=(f.status||"").replace(/^\S+\s+/,"");
  const chips=[stat?chipSt(stat):"",f.priority?`<span class="chip">${esc(f.priority)} priority</span>`:"",f.assignee?`<span class="chip">R: ${esc(f.assignee)}</span>`:"",f.approver?`<span class="chip">A: ${esc(f.approver)}</span>`:"",f.due?`<span class="chip ${f.due<TODAY&&!CLOSED.has(stat)?"late":""}">due ${esc(fmtDay(f.due))}</span>`:""].join("");
  const known=new Set(["status","priority","assignee","approver","due"]);
  const extra=fields.filter(([k])=>!known.has(k.toLowerCase()));
  const kids=parts.c, done=kids.filter(k=>CLOSED.has(k.status)).length;
  const linkRows=xs=>`<div class="box" style="padding-top:10px">${xs.map(x=>rowHTML(x,"")).join("")}</div>`;
  let h=`<div class="chips">${chips}</div>`;
  if(extra.length) h+=`<div class="meta">${extra.map(([k,v])=>`<span><span class="dim">${esc(k)}:</span> ${inlineMd(v)}</span>`).join("")}</div>`;
  if(kids.length) h+=`<h3>Depends on · ${done}/${kids.length} closed</h3><div class="pbar"><i style="width:${done/kids.length*100}%"></i></div>${linkRows(kids.slice().sort((a,b)=>CLOSED.has(a.status)-CLOSED.has(b.status)))}`;
  if(parts.p.length) h+=`<h3>Part of</h3>${linkRows(parts.p)}`;
  for(const sec of sections){
    const body=sec.body.join("\n").trim();
    if(/^notes/i.test(sec.title)){
      const notes=splitNotes(body).map(n=>[null,n.date,n.who,n.text]);
      const more=(body.match(/_…\s*and (\d+) older/)||[])[1];
      h+=`<h3>${esc(sec.title)}</h3><div class="box">${notes.map(n=>`<div class="nt"><div class="spread"><span class="who">${esc(short(n[2]))}</span><span class="who">${esc(fmtDay(n[1]))}</span></div><div class="md">${blockMd(n[3].trim())}</div></div>`).join("")||'<div class="empty">No notes.</div>'}${more?`<div class="empty">${esc(more)} older note${more==="1"?"":"s"} not shown.</div>`:""}</div>`;
    } else if(body){
      h+=`<h3>${esc(sec.title.replace(/^Description \/ /,""))}</h3><div class="dbox md">${blockMd(body)}</div>`;
    }
  }
  return h;
}
/* ---------- human-length text ---------- */
// "Acme renews — the team uses the system…" → "Acme renews".
// "acmeActiveUse: two users on the MCP every week" → the part after the alias.
function shortTitle(t){
  t=String(t||"").trim();
  const a=t.match(/^([a-z][A-Za-z0-9]+):\s+(.+)$/); if(a) t=a[2];
  const m=t.match(/^(.{3,70}?)\s+[—–]\s+.+$/)||t.match(/^(.{3,50}?):\s+.+$/);
  return m?m[1].trim():t;
}
// Deterministic fallback: no bracket tags, links, timestamps or ids; two sentences at most.
function cleanNote(t){
  let x=plain(t).replace(/https?:\/\/\S+/g,"").replace(/\(\s*[^()]*?(slack|dm|https?|permalink)[^()]*\)/gi,"")
    .replace(/\b\d{4}-\d{2}-\d{2}(T[\d:.]+Z?)?\b/g,"").replace(/\b(PACT|BEAD)-\d+\b/g,"").replace(/\s{2,}/g," ").replace(/\s+([.,;:])/g,"$1").trim();
  const sents=x.match(/[^.!?]+[.!?]+/g)||[x];
  return clip(sents.slice(0,2).join(" "),180);
}
let SAMPLE=null; try{ window.claude&&window.claude.use("sample").then(x=>{SAMPLE=x}).catch(()=>{}); }catch{}
const SUM_INFLIGHT={};
function latestBox(id,title,notes){
  const n=notes[0]; const key="hs.sum."+state.project+"."+id+"."+n.date+"."+String(n.text).length;
  const cached=store.get(key);
  const slot="sum-"+id.replace(/\W/g,"");
  if(!cached) setTimeout(()=>summarize(key,slot,title,notes),0);
  return `<div class="dbox"><span class="eb">Latest · ${esc(fmtDay(n.date))}</span><div id="${slot}" class="sumline">${esc(cached||cleanNote(n.text))}</div></div>`;
}
async function summarize(key,slot,title,notes){
  if(!SAMPLE||SUM_INFLIGHT[key]) return; SUM_INFLIGHT[key]=1;
  const input=`You write one-glance status lines for a team dashboard that busy humans skim.
In at most two short sentences (30 words total), say where this stands and how the people involved feel about it, in plain English, for example: "Efforts focused on delivering the onboarding flow. The client is happy so far."
No IDs, dates, URLs, quotes or internal jargon (ASK, delta, run, pipeline stage). Write in the language the notes are mostly written in.
Work item: ${title}
Latest notes, newest first:
${notes.slice(0,3).map(n=>`- ${n.date} ${short(n.who)}: ${String(n.text).slice(0,1500)}`).join("\n")}
Reply with the line only.`;
  try{
    const r=await SAMPLE(input,{modelTier:"quick"});
    const line=String(r&&r.text||"").trim().replace(/^["“]|["”]$/g,"");
    if(!line) return;
    store.set(key,line);
    const el=document.getElementById(slot); if(el) el.textContent=line;
  }catch(e){ if(e&&e.code==="not_granted") SAMPLE=null; }
  finally{ delete SUM_INFLIGHT[key]; }
}

/* ---------- pact detail, for humans: what it is, where it stands, what's next ---------- */
function plain(t){return unent(String(t||"")).replace(/\[([^\]]+)\]\([^)]+\)/g,"$1").replace(/\*\*|__|`/g,"").replace(/(^|\n)\s*(#+|>)\s*/g,"$1").replace(/^\s*\[[^\]]{0,40}\]\s*/,"").replace(/\s+/g," ").trim()}
function clip(t,n){t=plain(t);if(t.length<=n)return t;const cut=t.slice(0,n);const dot=cut.lastIndexOf(". ");return (dot>n*.5?cut.slice(0,dot+1):cut.replace(/\s+\S*$/,"")+"…")}
function beadParts(text){
  const t=String(text||""); const lines=t.split("\n");
  const head=(lines[0]||"").match(/^## \[(\w+)\]\s+(PACT-\d+)(?: · (\S+?))?:\s*(.*)$/)||[];
  const fields={}, kids=[], parents=[]; let mode=null, i=1;
  for(;i<lines.length;i++){
    const l=lines[i]; if(/^###\s/.test(l)) break; let m;
    if(/^- \*\*⬆ Blocked by/.test(l)){mode="c";continue}
    if(/^- \*\*⬇ Blocking/.test(l)){mode="p";continue}
    if((m=l.match(CHILD))&&mode){(mode==="c"?kids:parents).push({id:m[1],alias:m[2]||"",title:unent(m[3]),status:m[4]});continue}
    if((m=l.match(/^- \*\*(.+?)\*\*:\s*(.*)$/))){mode=null;fields[m[1].toLowerCase()]=m[2]}
  }
  const sections=[]; let cur=null;
  for(;i<lines.length;i++){const m=lines[i].match(/^###\s+(.*)/); if(m){cur={title:m[1],body:[]};sections.push(cur);continue} if(cur) cur.body.push(lines[i])}
  const desc=(sections.find(x=>/^description/i.test(x.title))?.body||[]).join("\n").trim();
  const notesSec=sections.find(x=>/^notes/i.test(x.title));
  const notes=notesSec?splitNotes(notesSec.body.join("\n")):[];
  return {type:(head[1]||"").toLowerCase(),title:head[4]?unent(head[4]):"",alias:head[3]||"",fields,kids,parents,desc,notes,
    status:(fields.status||"").replace(/^\S+\s+/,""),notesCount:notesSec?(+((notesSec.title.match(/\d+/)||[])[0])||notes.length):0};
}
function doneWhenOf(desc){
  const parts=desc.split(/\n(?=#{1,6}\s)/);
  const order=[/success criteria|acceptance criteria|done when|definition of done|criterios? de (é|e)xito|criterio/i,/qu[eé] hay que lograr|resultado|outcome|goal/i];
  let sec=null; for(const re of order){sec=parts.find(x=>new RegExp("^#{1,6}\\s*("+re.source+")","i").test(x));if(sec)break}
  const body=(sec?sec.replace(/^#{1,6}[^\n]*\n/,""):desc.replace(/^#{1,6}[^\n]*\n/gm,"")).trim();
  const bullets=body.split("\n").map(l=>l.match(/^\s*(?:[-*•]|\d+[.)])\s+(.*)/)).filter(Boolean).map(m=>clip(m[1],110));
  if(bullets.length) return {bullets:bullets.slice(0,3),more:bullets.length-3};
  const para=body.split(/\n\s*\n/).find(x=>x.trim()&&!/^(rafa|started|arranc)/i.test(x.trim()))||body;
  return {text:clip(para,220)};
}

  showDr(h);
}
function showDr(html){const dr=$("#dr");dr.innerHTML=html;dr.classList.add("on");$("#scrim").classList.add("on");dr.scrollTop=0}
const drHead=(eyebrow,title,lead="")=>`<div class="spread" style="align-items:flex-start"><span class="hrow">${lead}<span style="display:grid"><span class="mono dim">${esc(eyebrow)}</span><h2 style="font-size:17px">${esc(title)}</h2></span></span><button class="btn" data-close="1" type="button">Close</button></div>`;
const stat=(n,l,w)=>`<div><b class="${w&&n?"w":""}">${n}</b><span>${l}</span></div>`;
function taskList(ts){
  if(!ts.length) return `<div class="empty">None.</div>`;
  return `<div class="box" style="padding-top:10px">${ts.map(o=>rowHTML(o)).join("")}</div>`;
}
function goalList(gs){
  if(!gs.length) return `<div class="empty">None.</div>`;
  return `<div class="box">${gs.map(g=>`<div class="row" data-open="proj:${esc(g.id)}" tabindex="0" role="button">${status(g.status)}<span class="t"><span class="mono dim">${esc(g.id)}</span> ${esc(g.title)}${g.blockedKids||g.lateKids?`<br><span class="who" style="color:var(--warn)">${g.blockedKids} blocked · ${g.lateKids} overdue</span>`:""}</span><span class="s">${g.due?`<span class="${g.late?"k late":""}">${esc(fmtDay(g.due))}</span>`:"no date"} · ${g.total?g.closed+"/"+g.total:"—"}</span></div>`).join("")}</div>`;
}
function feedFor(ids,max=8){
  const f=(data.feed||data.fallbackFeed).filter(e=>ids.has((e.bead_id||"").replace("BEAD-","PACT-")));
  if(!f.length) return `<div class="empty">No changes in the last 14 days.</div>`;
  return `<div class="box">${f.slice(0,max).map(e=>`<div class="row" data-id="${esc((e.bead_id||"").replace("BEAD-","PACT-"))}" tabindex="0" role="button"><span class="k ${esc(e.action==="note"?"note":(e.changes?.status?.to||""))}">${esc(describe(e))}</span><span class="t">${esc(e.title||"")}${e.reason?`<br><span class="who">${esc(cleanNote(e.reason))}</span>`:""}</span><span class="s">${esc(short(e.changed_by))} · ${esc(fmtDay(String(e.timestamp)))}</span></div>`).join("")}</div>`;
}
function openProject(id){
  const p=data.gById.get(id); if(!p) return openDrawer(id);
  const stuck=p.open.filter(o=>o.status==="blocked"||(o.due&&o.due<TODAY));
  const done=p.children.filter(c=>CLOSED.has(c.status)).map(c=>({...(data.byId.get(c.id)||{}),...c}));
  showDr(`${drHead(p.id+(p.alias?" · "+p.alias:""),p.title,p.due?dateBox(p.due):"")}
    <div class="chips">${chipSt(p.status)}${p.late?`<span class="chip late">${daysBetween(p.due,TODAY)}d late</span>`:""}${p.assignee&&p.assignee!=="unassigned"?`<span class="chip">${esc(first(p.assignee))} owns it</span>`:""}${p.approver&&p.approver!==p.assignee&&p.approver!=="unassigned"?`<span class="chip">${esc(first(p.approver))} approves</span>`:""}</div>
    ${p.total?`<div style="display:grid;gap:4px"><div class="pbar" style="height:8px"><i style="width:${p.closed/p.total*100}%"></i></div><span class="mono">${p.closed}/${p.total} closed · ${p.open.length} open</span></div>`:""}
    ${p.notes&&p.notes.length?latestBox(p.id,p.title,p.notes):""}
    <button class="btn" data-id="${esc(p.id)}" type="button" style="align-self:flex-start">Done when, and full record →</button>
    <h3>Open tasks · ${p.open.length}${stuck.length?` · <span style="color:var(--warn)">${stuck.length} blocked or overdue</span>`:""}</h3>${p.open.length?taskList(p.open):`<div class="empty">Nothing open hangs from it. If the work is done, it can close.</div>`}
    ${done.length?`<details class="box"><summary class="box-h" style="cursor:pointer;padding-bottom:12px"><h2>Done · ${done.length}</h2><span class="dim">show</span></summary>${done.map(o=>rowHTML(o,"")).join("")}</details>`:""}
    <h3>Recent changes</h3>${feedFor(new Set([p.id,...p.open.map(o=>o.id)]))}`);
}
function openTheme(id){
  const t=data.themes.find(x=>x.id===id); if(!t) return openDrawer(id);
  const ids=new Set([t.id,...t.items.map(i=>i.id)]);
  showDr(`${drHead(t.id+" · theme",t.title,`<span class="dot ${t.warn?"warn":""}" style="width:14px;height:14px"></span>`)}
    <div class="trio">${stat(t.projs.length,"projects")}${stat(t.tasks.length,"open tasks")}${stat(t.attn.length,"need attention",1)}</div>
    <button class="btn" data-id="${esc(t.id)}" type="button" style="align-self:flex-start">Open the goal itself →</button>
    ${t.attn.length?`<h3>Needs attention</h3>${taskList(t.attn)}`:""}
    <h3>Projects</h3>${goalList(t.projs)}
    <h3>Recent changes</h3>${feedFor(ids,10)}`);
}
function openPerson(name){
  const r=data.resources.find(x=>x.name===name); if(!r) return;
  const first=name.split(/\s+/)[0].toLowerCase();
  const ids=new Set([...r.tasks.map(t=>t.id),...r.responsible.map(g=>g.id)]);
  showDr(`${drHead("Person",name,av(name,"pact"))}
    <div class="trio">${stat(r.responsible.length,"responsible")}${stat(r.accountable.length,"approver")}${stat(r.stuck,"stuck tasks",1)}</div>
    ${r.responsible.length?`<h3>Responsible for</h3>${goalList(r.responsible)}`:""}
    ${r.accountable.length?`<h3>Approver of</h3>${goalList(r.accountable)}`:""}
    <h3>Open tasks on their name · ${r.tasks.length}</h3>${taskList(r.tasks)}
    <h3>Recent changes on their work</h3>${feedFor(ids,10)}`);
}
function openUnfiled(){
  const u=data.unfiled;
  showDr(`${drHead("Unfiled","Not linked to any goal")}
    <div class="dbox warn"><span class="eb">Why they don't show under a project</span>A task appears in Projects and Themes through the goal it hangs from. These ${u.length} have no open goal above them. Add each one to the depends_on of the goal it serves and it moves there on the next refresh.</div>
    ${taskList(u)}`);
}
function closeDrawer(){$("#dr").classList.remove("on");$("#scrim").classList.remove("on")}

/* ---------- approve close ---------- */
async function approve(btn){
  const id=btn.dataset.approve;
  if(!btn.classList.contains("arm")){btn.classList.add("arm");btn.textContent="Confirm close";setTimeout(()=>{if(btn.isConnected&&!btn.disabled){btn.classList.remove("arm");btn.textContent="Approve"}},5000);return}
  btn.disabled=true; btn.textContent="Closing…";
  const g=data.closeCands.find(x=>x.id===id); const server=PROJECTS[state.project].server;
  try{
    await mcp.callTool(server,"add_note",{bead_id:id,text:`Close approved from the harness artifact. Evidence: ${g.evidence}`});
    await mcp.callTool(server,"update_status",{bead_id:id,status:"done",reason:`Closed from the harness: ${g.evidence}`});
    btn.textContent="Closed ✓";
    await mcp.invalidate(server).catch(()=>{});
    load(true);
  }catch(e){
    btn.disabled=false; btn.classList.remove("arm"); btn.textContent="Approve";
    $("#note").innerHTML=`<div class="banner err">Couldn't close ${esc(id)}: ${esc(errText(e,server))}</div>`;
  }
}

/* ---------- wiring ---------- */
// Projects shown = the ones declared here whose connector this viewer has connected.
let SHOWN=Object.keys(PROJECTS);
const ADD_PROMPT="Add any Pact project I have connected that isn't on my Management Harness yet: run /harness, keep the projects already on it, and update the same artifact.";
function renderSwitcher(){
  $("#proj").innerHTML=SHOWN.map(k=>`<button type="button" data-proj="${k}" aria-pressed="${state.project===k}">${esc(PROJECTS[k].label)}</button>`).join("")
    +(OPTIONS.add?`<button type="button" class="addp" data-copy="${esc(ADD_PROMPT)}" title="Add a project" aria-label="Add a project">+</button>`:"");
}
renderSwitcher();
document.addEventListener("click",e=>{
  if(e.target.id==="doupd") return applyUpdate(e.target);
  if(e.target.id==="scrim"||e.target.closest("[data-close]")) return closeDrawer();
  const o=e.target.closest("[data-open]");
  if(o&&data){const v=o.dataset.open,i=v.indexOf(":"),k=v.slice(0,i),id=v.slice(i+1);({proj:openProject,theme:openTheme,person:openPerson,unfiled:openUnfiled,src:openSource})[k]?.(id);return}
  const cp=e.target.closest("[data-copy]");
  if(cp){ const v=cp.dataset.copy; const isAdd=cp.classList.contains("addp");
    navigator.clipboard.writeText(v).then(()=>{ if(isAdd) $("#note").innerHTML=`<div class="banner">Copied — paste it in the chat and Claude will add the project here.</div>`; else cp.textContent="Copied — paste in chat"; },()=>{$("#note").innerHTML=`<div class="banner"><b>Paste this in the chat:</b><br>${esc(v)}</div>`;closeDrawer()}); return; }
  const t=e.target.closest("[data-proj],[data-tab],[data-hz],[data-approve],[data-ask],[data-notify],[data-send],[data-id]");
  if(!t) return;
  if(t.dataset.proj){ if(t.dataset.proj===state.project) return; state.project=t.dataset.proj; store.set("hs.project",state.project); document.querySelectorAll("[data-proj]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.proj===state.project)); data=null; if(mcp) load(false); return; }
  if(t.dataset.tab){ state.tab=t.dataset.tab; store.set("hs.tab",state.tab); render(); return; }
  if(t.dataset.hz){ HZ=t.dataset.hz; store.set("hs.hz",HZ); render(); return; }
  if(t.dataset.approve){ approve(t); return; }
  if(t.dataset.ask!==undefined){ askClaude(t); return; }
  if(t.dataset.notify!==undefined){ openNotify(+t.dataset.notify); return; }
  if(t.dataset.send){ sendNotify(t); return; }
  if(t.dataset.id){ openDrawer(t.dataset.id); }
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape") closeDrawer();
  if((e.key==="Enter"||e.key===" ")&&e.target.matches(".row[data-id],.row[data-open],.item[data-id]")){e.preventDefault();e.target.click()}
});
document.addEventListener("change",e=>{ if(e.target.id==="mepick"&&data){ store.set("hs.me."+data.project,e.target.value); data.myday=myDay(data,null); if(!e.target.value) data.myday.me=null; render(); } });
$("#refresh").onclick=()=>{ if(mcp) load(true); };

/* ---------- self-update: the page republishes itself from the server's template ---------- */
// Nobody updates a plugin: the Pact server serves the latest template, the page
// offers it, and one click republishes this same artifact with its own config.
const TOKEN=k=>"__"+k+"__";   // built at runtime so this code never contains a literal token
const SKELETON_HEAD='<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>';
const jsLit=v=>JSON.stringify(v).replace(/</g,"\\u003c");
let UPDATE=null;
async function checkUpdate(){
  let best=null;
  for(const k of SHOWN){
    try{
      const r=await mcp.callTool(PROJECTS[k].server,"harness_template",{known_version:HARNESS_VERSION},{cache:{staleTime:300000,gcTime:3600000}});
      const p=r&&r.payload;
      if(p&&p.version&&p.html&&p.version>HARNESS_VERSION&&(!best||p.version>best.version)) best=p;
    }catch{}
  }
  if(!best) return;
  UPDATE=best;
  $("#note").innerHTML=`<div class="banner upd"><span>A new version of the harness is ready.</span><button class="btn pri" id="doupd" type="button">Update</button></div>`;
}
async function applyUpdate(btn){
  if(!UPDATE) return;
  const art=window.claude?await window.claude.use("artifact").catch(()=>null):null;
  const fail=t=>{ $("#note").innerHTML=`<div class="banner">${t}</div>`; };
  if(!art) return fail(`This view can't update the page. Ask Claude in the chat: "update my Management Harness to the latest template".`);
  btn.disabled=true; btn.textContent="Updating…";
  let body=UPDATE.html
    .replace(TOKEN("PROJECTS"),jsLit(PROJECTS))
    .replace(TOKEN("CHANNELS"),jsLit(CHANNELS))
    .replace(TOKEN("OPTIONS"),jsLit(OPTIONS))
    .replace(TOKEN("TITLE"),esc(document.title));
  if(["PROJECTS","CHANNELS","OPTIONS","TITLE"].some(k=>body.includes(TOKEN(k)))) return fail("The new template looks malformed; skipped.");
  try{ await art.publish(SKELETON_HEAD+"\n"+body+"\n</body></html>"); }
  catch(e){
    if(e&&e.code==="conflict") return;   // the view is already reloading to the winner
    btn.disabled=false; btn.textContent="Update";
    fail(e&&(e.code==="not_writer"||e.code==="not_granted")?`Only the owner of this page can update it. Ask them to click Update.`:`Couldn't update just now (${esc(e&&e.code||"error")}).`);
  }
}

(async()=>{
  mcp = window.claude ? await window.claude.use("mcp") : null;
  if(!mcp){ $("#fresh").textContent=""; $("#panel").innerHTML='<div class="banner err">Open this page in claude.ai with your Pact connectors to see live data.</div>'; return; }
  try{
    const lt=await mcp.listTools();
    const live=new Set((lt.servers||[]).filter(sv=>(sv.tools||[]).length&&sv.authStatus!=="needs_reauth").map(sv=>sv.server));
    const keep=Object.keys(PROJECTS).filter(k=>live.has(PROJECTS[k].server));
    if(keep.length){ SHOWN=keep; if(!keep.includes(state.project)) state.project=keep[0]; renderSwitcher(); }
  }catch{}
  load(false);
  setTimeout(checkUpdate,1500);
})();
</script>
