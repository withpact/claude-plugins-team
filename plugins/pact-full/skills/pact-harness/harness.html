<title>Management Harness</title>
<style>
:root{
  --bg:#f3f5f7; --surface:#fff; --surface-2:#eaeef2; --ink:#16202b; --ink-2:#4a5866; --ink-3:#7a8794; --line:#d5dce3;
  --p:#2450c9; --p-soft:#e3eafb; --a:#18805a; --a-soft:#dcf1e7; --r:#a86a06; --r-soft:#f8ecd5;
  --warn:#b4402a; --warn-soft:#f9e2dc; --focus:#2450c9;
  --body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){color-scheme:dark;
  --bg:#10161d; --surface:#18212a; --surface-2:#222d38; --ink:#e6ecf2; --ink-2:#aab6c2; --ink-3:#7d8a97; --line:#2c3845;
  --p:#7c9cf2; --p-soft:#1c2946; --a:#4cc596; --a-soft:#15302a; --r:#e0a64a; --r-soft:#33291a; --warn:#f08a74; --warn-soft:#3a221e; --focus:#7c9cf2}}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#10161d; --surface:#18212a; --surface-2:#222d38; --ink:#e6ecf2; --ink-2:#aab6c2; --ink-3:#7d8a97; --line:#2c3845;
  --p:#7c9cf2; --p-soft:#1c2946; --a:#4cc596; --a-soft:#15302a; --r:#e0a64a; --r-soft:#33291a; --warn:#f08a74; --warn-soft:#3a221e; --focus:#7c9cf2}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--body);margin:0}
.wrap{max-width:920px;margin:0 auto;padding:16px 16px 48px}
h1{font-size:22px;margin:0;line-height:1.15}
h2{font-size:15px;margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.mono{font-family:var(--mono);font-size:11.5px}
.dim{color:var(--ink-3)}
.top{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between}
.ctl{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--surface-2);border-radius:8px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:5px 10px;border-radius:6px;cursor:pointer;font-size:13px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 10px;cursor:pointer;font-size:13px}
.btn.pri{background:var(--a);color:#fff;border-color:var(--a)}
.btn.pri.arm{background:var(--warn);border-color:var(--warn)}
.btn:disabled{opacity:.5;cursor:default}
.fresh{font-size:11.5px;color:var(--ink-3);margin-top:4px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:14px 0 12px;padding-bottom:2px}
.tab{all:unset;cursor:pointer;flex:1 0 auto;min-width:88px;padding:8px 10px;border-radius:10px;background:var(--surface);border:1px solid var(--line);display:grid;gap:1px}
.tab[aria-selected="true"]{background:var(--p-soft);border-color:var(--p)}
.tab:focus-visible{outline:2px solid var(--focus)}
.tab b{font-size:20px;line-height:1}
.tab span{font-size:12px;color:var(--ink-2);font-weight:600}
.panel{display:grid;gap:12px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.box-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.row{display:grid;grid-template-columns:minmax(0,max-content) minmax(0,1fr) auto;gap:8px;align-items:baseline;padding:7px 12px;border-bottom:1px solid var(--line);font-size:13px;cursor:pointer}
.row:last-child{border-bottom:0}
.row:hover{background:var(--surface-2)}
.row .t{min-width:0;overflow-wrap:anywhere}
.row .s{font-size:12px;color:var(--ink-3);white-space:nowrap}
.k{font-family:var(--mono);font-size:10px;padding:1px 5px;border-radius:4px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap;display:inline-block;max-width:180px;overflow:hidden;text-overflow:ellipsis;vertical-align:baseline}
.who{overflow-wrap:anywhere}
.k.done{background:var(--a-soft);color:var(--a)} .k.blocked,.k.late{background:var(--warn-soft);color:var(--warn)}
.k.in_progress,.k.review{background:var(--p-soft);color:var(--p)} .k.note{background:var(--r-soft);color:var(--r)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.card{all:unset;box-sizing:border-box;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:6px;align-content:start}
.card:hover{border-color:var(--p)} .card:focus-visible{outline:2px solid var(--focus)}
.card.late{border-left:4px solid var(--warn)}
.card .t{font-weight:600;font-size:13.5px;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:4px 8px;font-size:12px;color:var(--ink-2)}
.pbar{height:5px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--a)}
.banner{padding:10px 12px;border-radius:10px;background:var(--r-soft);color:var(--ink);font-size:13px}
.banner.err{background:var(--warn-soft)}
.empty{padding:14px 12px;color:var(--ink-3);font-size:13px}
.cl{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--line)}
.cl:last-child{border-bottom:0}
.cl .t{font-size:13px;overflow-wrap:anywhere;cursor:pointer}
.cl .ev{font-size:12px;color:var(--ink-3)}
.day{padding:6px 12px;font-size:11.5px;font-weight:700;color:var(--ink-3);background:var(--surface-2);text-transform:uppercase;letter-spacing:.04em}
.who{font-size:12px;color:var(--ink-3)}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none}
.scrim.on{display:block}
.dr{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--bg);border-left:1px solid var(--line);transform:translateX(100%);transition:transform .18s;overflow-y:auto;padding:14px 16px 40px;display:flex;flex-direction:column;gap:10px}
.dr.on{transform:none}
.dr>*{flex:none}
.dr pre{white-space:pre-wrap;font:12.5px/1.5 var(--body);margin:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;overflow-wrap:anywhere}
/* ported from /harness: date boxes, timeline, theme groups, people */
.hrow{display:flex;gap:10px;align-items:center}
.date{display:grid;place-items:center;min-width:44px;padding:4px 6px;border-radius:8px;background:var(--surface-2);line-height:1.05;text-align:center;flex:none}
.date b{font-size:18px}
.date span{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3)}
.date.late{background:var(--warn-soft)} .date.late b,.date.late span{color:var(--warn)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:11px;padding:2px 7px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap;font-weight:500}
.chip.late{background:var(--warn-soft);color:var(--warn)} .chip.go{background:var(--p-soft);color:var(--p)} .chip.ok{background:var(--a-soft);color:var(--a)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;background:var(--a);flex:none}
.dot.warn{background:var(--warn)}
.av{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;font-size:10.5px;font-weight:700;background:var(--surface-2);color:var(--ink-2);border:2px solid var(--surface);flex:none}
.av.pact{background:var(--p-soft);color:var(--p)}
.avs{display:flex}.avs .av+.av{margin-left:-6px}
.spread{display:flex;gap:8px;align-items:center;justify-content:space-between}
.tl{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 12px 6px;overflow-x:auto}
.tl-in{min-width:520px;display:grid;grid-template-columns:140px 1fr;row-gap:3px;font-size:12px}
.tl-l{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-2);padding-right:8px;line-height:20px}
.tl-t{position:relative;height:20px;border-bottom:1px dashed var(--line)}
.tl-t .pt{position:absolute;top:5px;width:10px;height:10px;border-radius:50%;background:var(--p);transform:translateX(-5px)}
.tl-t .pt.late{background:var(--warn)}
.tl-today{position:absolute;top:0;bottom:0;width:2px;background:var(--ink);opacity:.5}
.tl-ax{position:relative;height:18px;font-size:10.5px;color:var(--ink-3)}
.tl-ax span{position:absolute;transform:translateX(-50%)}
.agrp{display:grid;gap:8px}
.agrp-h{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;padding:6px 10px;border-radius:8px;background:var(--a-soft)}
.agrp-h b{color:var(--a)} .agrp-h.warn{background:var(--warn-soft)} .agrp-h.warn b{color:var(--warn)}
.agrp-h:focus-visible{outline:2px solid var(--focus)}
.card.tint{border-left:4px solid var(--a)} .card.tint.warn{border-left-color:var(--warn)}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.trio div{display:grid;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px}
.trio b{font-size:22px} .trio b.w{color:var(--warn)}
.trio span{font-size:11px;color:var(--ink-3)}
.eb{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);font-weight:600}
.dbox{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:4px;font-size:13.5px}
.dbox.warn{background:var(--warn-soft);border-color:transparent} .dbox.warn .eb{color:var(--warn)}
.dbox ol{margin:0;padding-left:18px;display:grid;gap:2px}
.dr h3{font-size:13px;color:var(--ink-3);margin:6px 0 0}
.md{font-size:13.5px;line-height:1.5;overflow-wrap:anywhere}
.md p{margin:0 0 8px} .md p:last-child{margin-bottom:0}
.md h4{font-size:13.5px;margin:10px 0 4px} .md h4:first-child{margin-top:0}
.md ul,.md ol{margin:0 0 8px;padding-left:20px;display:grid;gap:2px}
.md code{font-family:var(--mono);font-size:12px;background:var(--surface-2);padding:0 4px;border-radius:4px}
.md a{color:var(--p)}
.nt{padding:10px 12px;border-bottom:1px solid var(--line);display:grid;gap:4px}
.nt:last-child{border-bottom:0}
.row>.k{align-self:start}
.rico{display:inline-block;width:1.2em;text-align:center;color:var(--p)}
select.btn{padding:4px 8px}
.ta{width:100%;font:13.5px/1.45 var(--body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;resize:vertical}
.srow{display:grid;gap:4px;padding:9px 12px;border-bottom:1px solid var(--line)}
.srow:last-child{border-bottom:0}
button.chip.src{border:0;cursor:pointer;font-size:12px;padding:3px 9px}
button.chip.src:hover{background:var(--p-soft);color:var(--p)}
.clamp{font-size:13px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere;white-space:pre-wrap}
.skel{height:14px;border-radius:6px;background:var(--surface-2);margin:10px 12px}
</style>

<div class="wrap">
  <div class="top">
    <div>
      <h1 id="title">Management Harness</h1>
      <div class="fresh" id="fresh">Loading…</div>
    </div>
    <div class="ctl">
      <div class="seg" id="proj" role="group" aria-label="Project"></div>
      <button class="btn" id="refresh" type="button">Refresh</button>
    </div>
  </div>
  <div id="note"></div>
  <div class="tabs" role="tablist" id="tabs"></div>
  <div class="panel" id="panel"></div>
</div>
<div class="scrim" id="scrim"></div>
<aside class="dr" id="dr" aria-label="Pact detail"></aside>

<script>
// Filled in by the pact-harness skill: one entry per Pact connector the user has.
// key = project name (from whoami), server = the connector's display name.
const PROJECTS = __PROJECTS__;
const TABS = [["myday","My day"],["activity","Activity"],["projects","Projects"],["themes","Themes"],["people","Resources"],["archive","Archive"]];
const CLOSED = new Set(["done","cancelled"]);
const TODAY = new Date().toISOString().slice(0,10);

const $ = s => document.querySelector(s);
const store = {get(k){try{return localStorage.getItem(k)}catch{return null}}, set(k,v){try{localStorage.setItem(k,v)}catch{}}};
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function unent(s){return String(s??"").replace(/&amp;/g,"&").replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&quot;/g,'"').replace(/&#39;/g,"'")}
function fmtDay(iso){if(!iso)return"";const d=new Date(iso.length===10?iso+"T12:00:00":iso);return d.toLocaleDateString(undefined,{month:"short",day:"numeric"})}
function fmtTime(iso){const d=new Date(iso);return isNaN(d)?"":d.toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit"})}
function ago(ms){const m=Math.round((Date.now()-ms)/60000);return m<1?"just now":m<60?m+" min ago":Math.round(m/60)+" h ago"}
function short(name){return (name||"").replace(/^beads-mcp:/,"")}

let state = {project: store.get("hs.project") || Object.keys(PROJECTS)[0], tab: store.get("hs.tab") || "myday"};
if(!PROJECTS[state.project]) state.project = Object.keys(PROJECTS)[0];
let mcp = null, data = null, loadSeq = 0;

/* ---------- parsing the connector's markdown ---------- */
const LINE = /^- \S+ \*\*(PACT-\d+)(?: · ([^*]+?))?\*\* — (.*) \((not_started|in_progress|blocked|review|done|cancelled), R: (.*?) · A: (.*?)(?:, due (\d{4}-\d{2}-\d{2}))?\)\s*$/;
function parseList(text){
  const out=[];
  for(const l of String(text||"").split("\n")){
    const m=l.match(LINE); if(!m) continue;
    out.push({id:m[1],alias:m[2]||"",title:unent(m[3]),status:m[4],assignee:m[5],approver:m[6],due:m[7]||null});
  }
  return out;
}
const CHILD = /^\s+- \S+ (PACT-\d+)(?: · (\S+))? — (.*) \((not_started|in_progress|blocked|review|done|cancelled)\)\s*$/;
function splitNotes(body){
  return String(body||"").replace(/\n\s*_…[^\n]*_\s*$/,"").split(/\n(?=- \[\d{4}-\d{2}-\d{2}\] )/)
    .map(c=>c.match(/^\s*- \[(\d{4}-\d{2}-\d{2})\] (\S+): ([\s\S]*)$/)).filter(Boolean)
    .map(m=>({date:m[1],who:m[2],text:m[3].trim()}));
}
function parseBead(text){
  const t=String(text||""); const children=[], parents=[]; let mode=null;
  const type=(t.match(/^## \[(\w+)\]/m)||[])[1]||"";
  for(const l of t.split("\n")){
    if(/^- \*\*⬆ Blocked by/.test(l)){mode="c";continue}
    if(/^- \*\*⬇ Blocking/.test(l)){mode="p";continue}
    if(/^- \*\*/.test(l)||/^#/.test(l)){mode=null;continue}
    const m=l.match(CHILD);
    if(m&&mode){(mode==="c"?children:parents).push({id:m[1],alias:m[2]||"",title:unent(m[3]),status:m[4]})}
  }
  const notes=splitNotes((t.split(/^### Notes.*$/m)[1]||"").split(/^###\s/m)[0]);
  return {type:type.toLowerCase(),children,parents,notes};
}

/* ---------- connector calls ---------- */
function errText(e, server){
  const c=e&&e.code;
  if(c==="server_not_connected") return `Add ${server} in claude.ai Settings → Connectors.`;
  if(c==="needs_reauth") return `Reconnect ${server} in claude.ai Settings → Connectors.`;
  if(c==="not_in_manifest") return `${server} isn't allowed for this page.`;
  if(c==="selection_required") return `Pick which ${server} connector to use when claude.ai asks.`;
  return (e&&e.message)||"The connector didn't answer.";
}
async function call(tool,input,fresh){
  const r=await mcp.callTool(PROJECTS[state.project].server,tool,input,{cache:{staleTime:fresh?0:120000,gcTime:3600000,refresh:!!fresh}});
  return r;
}
async function pool(items,n,fn){
  const out=new Array(items.length); let i=0;
  await Promise.all(Array.from({length:Math.min(n,items.length)},async()=>{while(i<items.length){const k=i++;try{out[k]=await fn(items[k])}catch(e){out[k]=null}}}));
  return out;
}

async function load(fresh){
  const seq=++loadSeq; const proj=state.project; const server=PROJECTS[proj].server;
  $("#title").textContent=PROJECTS[proj].title;
  $("#fresh").textContent="Loading from "+server+"…";
  if(!data||data.project!==proj){ $("#panel").innerHTML='<div class="box">'+'<div class="skel"></div>'.repeat(6)+'</div>'; $("#tabs").innerHTML=""; }
  let goalsR, openR, doneR;
  try{
    [goalsR, openR, doneR] = await Promise.all([
      call("list_goals",{include_milestones:true},fresh),
      call("list_beads",{},fresh),
      call("list_goals",{include_milestones:true,status:"done"},fresh),
    ]);
  }catch(e){
    if(seq!==loadSeq) return;
    $("#fresh").textContent="";
    $("#panel").innerHTML=`<div class="banner err">${esc(errText(e,server))}</div>`;
    return;
  }
  if(seq!==loadSeq) return;
  const storedAt=Math.min(...[goalsR,openR].map(r=>r.cache?.storedAt||Date.now()));
  const goals=parseList(goalsR.payload), open=parseList(openR.payload), doneGoals=parseList(doneR.payload);

  let me=null;
  try{ const w=String((await call("whoami",{},fresh)).payload||""); me=(w.match(/Connected as `([^`]+)`/)||[])[1]||null; }catch{}
  let history=null, historyErr=null;
  try{ const h=await call("list_history",{days:14,limit:400},fresh); history=(h.payload&&h.payload.items)||[]; }
  catch(e){ historyErr=e; }

  const details=await pool(goals,5,g=>call("get_bead",{bead_id:g.id,notes_limit:3},fresh).then(r=>parseBead(r.payload)));
  if(seq!==loadSeq) return;
  goals.forEach((g,i)=>Object.assign(g,details[i]||{children:[],parents:[],notes:[],type:""}));
  data=shape(proj,goals,open,doneGoals,history,historyErr,storedAt);
  data.myday=myDay(data,me);
  render();
  loadSources(fresh,seq);
}

/* ---------- My day: what matters to the viewer today ---------- */
const DAY=864e5;
const daysBetween=(a,b)=>Math.round((new Date(b+"T12:00:00")-new Date(a+"T12:00:00"))/DAY);
const first=n=>String(n||"").split(/\s+/)[0];
function resolveMe(d,dev){
  const names=new Set(); for(const b of d.open){names.add(b.assignee);names.add(b.approver)}
  const real=[...names].filter(n=>n&&n!=="unassigned"&&n!=="—");
  const saved=store.get("hs.me."+d.project); if(saved&&real.includes(saved)) return {name:saved,names:real};
  const k=String(dev||"").toLowerCase().replace(/^beads-mcp:/,"");
  const hit=k&&(real.find(n=>n.toLowerCase()===k)||real.find(n=>first(n).toLowerCase()===k)||real.find(n=>n.toLowerCase().replace(/\s+/g,"").includes(k)));
  return {name:hit||null,names:real.sort()};
}
function myDay(d,dev){
  const who=resolveMe(d,dev); const me=who.name;
  const out={me,names:who.names,count:0,overdue:[],soon:[],review:[],blocked:[],justDone:[],recs:[]};
  if(!me) return out;
  const mine=b=>b.assignee===me, iApprove=b=>b.approver===me;
  const weekOut=new Date(Date.now()+7*DAY).toISOString().slice(0,10);
  out.overdue=d.open.filter(b=>mine(b)&&b.due&&b.due<TODAY).sort((a,b)=>a.due.localeCompare(b.due));
  out.soon=d.open.filter(b=>mine(b)&&b.due&&b.due>=TODAY&&b.due<=weekOut).sort((a,b)=>a.due.localeCompare(b.due));
  out.review=d.open.filter(b=>iApprove(b)&&!mine(b)&&b.status==="review");
  out.blocked=d.open.filter(b=>(mine(b)||iApprove(b))&&b.status==="blocked");
  const parentOf=new Map(); for(const g of d.goals) for(const c of g.children) if(!parentOf.has(c.id)) parentOf.set(c.id,g);
  const since3=new Date(Date.now()-3*DAY).toISOString();
  const seen=new Set();
  for(const e of (d.feed||[])){
    const to=e.changes?.status?.to; if(to!=="done"||String(e.timestamp)<since3) continue;
    const id=(e.bead_id||"").replace("BEAD-","PACT-"); if(seen.has(id)) continue; seen.add(id);
    const g=parentOf.get(id); const item=d.byId.get(id)||{};
    const relevant=!g||g.assignee===me||g.approver===me||item.assignee===me||item.approver===me||short(e.changed_by).toLowerCase()===String(dev||"").toLowerCase();
    if(relevant) out.justDone.push({id,title:e.title||item.title||"",when:e.timestamp,by:short(e.changed_by),goal:g||null});
  }
  // recommended actions — deterministic rules over the board
  const R=out.recs;
  for(const g of d.closeCands) if(g.assignee===me||g.approver===me)
    R.push({kind:"close",id:g.id,title:`${g.id} looks ready to close`,why:g.evidence,approve:g.id});
  const byPerson=new Map();
  for(const j of out.justDone){const g=j.goal; if(!g) continue; for(const who of [g.approver,g.assignee]){ if(!who||who===me||who==="unassigned"||who==="—") continue; if(!byPerson.has(who)) byPerson.set(who,[]); byPerson.get(who).push(j); break; }}
  for(const [who,js] of byPerson){
    const goals=[...new Set(js.map(j=>j.goal.title))];
    const g0=js[0].goal;
    const draft=`Hi ${first(who)} — quick update on ${goals.join(" and ")}:\n${js.map(j=>`• ${j.id} ${j.title} — closed`).join("\n")}\n${goals.length===1&&g0.total?`That puts it at ${g0.closed}/${g0.total} done.`:""}\nHappy to walk you through it.`;
    R.push({kind:"notify",to:who,draft,bead:js[0].id,title:`Tell ${first(who)} about recent progress`,why:`${js.length} closed under ${goals.join(", ")} — ${first(who)} is on ${goals.length>1?"those goals":"that goal"}.`,
      prompt:`Draft a short message to ${who} about recent progress: ${js.map(j=>`${j.id} "${j.title}" was closed`).join("; ")}. Say what it moves forward in ${goals.join(", ")} (read the goal with get_bead), keep it to 3–4 lines, and show me the draft before sending anything.`});
  }
  for(const b of out.overdue){const late=daysBetween(b.due,TODAY); if(late>=14) R.push({kind:"late",id:b.id,title:`${b.id} is ${late} days late`,why:b.title,
    prompt:`${b.id} "${b.title}" is ${late} days past its due date (${b.due}). Read it with get_bead (full notes) and help me decide: reschedule to a realistic date, close it with its evidence, or cancel it. Propose one, don't change anything until I confirm.`});}
  for(const b of out.review) R.push({kind:"review",id:b.id,title:`${b.id} is waiting for your review`,why:`${b.title} — from ${first(b.assignee)}`,
    prompt:`${b.id} "${b.title}" is in review and I'm the approver. Read it with get_bead (full notes) and summarize what was delivered against its acceptance criteria, so I can approve or send it back.`});
  for(const b of out.blocked) R.push({kind:"blocked",id:b.id,title:`Unblock ${b.id}`,why:`${b.title} — ${b.assignee===me?"yours":"you approve it"}`,
    prompt:`${b.id} "${b.title}" is blocked. Read its notes with get_bead and tell me what it's waiting on, who can unblock it, and draft the one message that would move it.`});
  const myUnfiled=d.unfiled.filter(mine);
  if(myUnfiled.length) R.push({kind:"link",title:`Link ${myUnfiled.length} of your task${myUnfiled.length>1?"s":""} to a goal`,why:myUnfiled.slice(0,3).map(b=>b.id).join(", ")+(myUnfiled.length>3?"…":""),
    prompt:`These open tasks of mine aren't under any goal: ${myUnfiled.map(b=>`${b.id} "${b.title}"`).join("; ")}. Propose which goal each one belongs under (list_goals), and link them only after I confirm.`});
  out.count=out.overdue.length+out.review.length+R.length;
  return out;
}

/* ---------- sources: what the signal-graph pipelines ingested ---------- */
const SRC_DAYS=14;
function toolText(e){
  const r=e&&e.result; const c=r&&(r.content||r.result?.content);
  return String((e&&e.message)||"")+" "+(Array.isArray(c)?c.map(b=>b.text||"").join(" "):"");
}
function fenceJSON(t){const m=String(t||"").match(/```json\s*([\s\S]*?)```/);try{return m?JSON.parse(m[1]):[]}catch{return []}}
function platform(src){return (String(src||"Other").split(/[\s·:—-]+/)[0]||"Other")}
async function loadSources(fresh,seq){
  const proj=state.project;
  let pipes;
  try{ await call("graph_read",{kind:"runs",stage:"ingest",limit:1},fresh); pipes=[null]; }
  catch(e){
    const m=toolText(e).match(/more than one pipeline \(([^)]+)\)/);
    if(!m){ if(seq===loadSeq&&data){data.sources=[];if(state.tab==="activity")render()} return; }
    pipes=m[1].split(",").map(x=>x.trim()).filter(Boolean);
  }
  const since=new Date(Date.now()-SRC_DAYS*864e5).toISOString();
  const out=await pool(pipes,3,async pipe=>{
    const base=pipe?{pipeline:pipe}:{};
    const runsTxt=String((await call("graph_read",{...base,kind:"runs",stage:"ingest",limit:500},fresh)).payload||"");
    const runs=[...runsTxt.matchAll(/`run_(\S+?)_ingest` · ingest · (\w+) · in:(\d+) out:(\d+)/g)].map(m=>({ts:m[1],status:m[2],out:+m[4]}));
    const total=runs.reduce((a,r)=>a+r.out,0);
    const win=runs.filter(r=>r.ts>=since); const winCount=win.reduce((a,r)=>a+r.out,0);
    let items=[];
    if(winCount){
      const r=await call("graph_read",{...base,kind:"raw",format:"full",limit:500,since_seq:Math.max(0,total-winCount-60)},fresh);
      items=fenceJSON(r.payload).filter(x=>{const m=String(x.run_id||"").match(/^run_(\S+?)_ingest/);return m&&m[1]>=since})
        .sort((a,b)=>String(b.occurred_at||"").localeCompare(String(a.occurred_at||"")));
    }
    return {pipeline:pipe,last:runs[0]||null,items};
  });
  if(seq!==loadSeq||!data||state.project!==proj) return;
  data.sources=out.filter(Boolean);
  if(state.tab==="activity") render();
}
function sourcesHTML(d){
  if(d.sources===undefined) return `<div class="box"><div class="box-h"><h2>Sources</h2><span class="dim">loading…</span></div></div>`;
  if(!d.sources.length) return "";
  const multi=d.sources.length>1;
  const rows=d.sources.map(p=>{
    const by={}; for(const it of p.items){const k=platform(it.source);by[k]=(by[k]||0)+1}
    const chips=Object.entries(by).sort((a,b)=>b[1]-a[1]).map(([k,n])=>`<button class="chip src" data-open="src:${esc(p.pipeline||"")}|${esc(k)}" type="button">${esc(k)} <b>${n}</b></button>`).join("");
    const last=p.last?`last ingest ${esc(fmtDay(p.last.ts))} ${esc(fmtTime(p.last.ts))}${p.last.status!=="ok"?` · <span class="k late">${esc(p.last.status)}</span>`:""}`:"never ingested";
    return `<div class="srow">${multi?`<span class="mono">${esc(p.pipeline)}</span>`:""}<span class="chips">${chips||'<span class="dim">nothing new</span>'}</span><span class="who">${last}</span></div>`;
  }).join("");

  return `<div class="box"><div class="box-h"><h2>Sources · ${SRC_DAYS} days</h2><span class="dim">${n} items ingested</span></div>${rows}</div>`;
}

    </div>`).join("")}</div>`).join("")}`);

/* ---------- shaping ---------- */
function shape(project,goals,open,doneGoals,history,historyErr,storedAt){
  const byId=new Map();
  for(const b of open) byId.set(b.id,b);
  for(const g of goals){ byId.set(g.id,{...byId.get(g.id),...g}); for(const c of g.children) if(!byId.has(c.id)) byId.set(c.id,c); for(const p of g.parents) if(!byId.has(p.id)) byId.set(p.id,p); }
  for(const g of doneGoals) if(!byId.has(g.id)) byId.set(g.id,g);
  const goalIds=new Set(goals.map(g=>g.id));
  const filed=new Set(); for(const g of goals) for(const c of g.children) filed.add(c.id);

  for(const g of goals){
    g.total=g.children.length; g.closed=g.children.filter(c=>CLOSED.has(c.status)).length;
    g.late=!!(g.due&&g.due<TODAY); g.openParents=g.parents.filter(p=>goalIds.has(p.id));
  }
  const gById=new Map(goals.map(g=>[g.id,g]));
  for(const g of goals){
    g.open=g.children.filter(c=>!CLOSED.has(c.status)&&!goalIds.has(c.id)).map(c=>({...c,...(byId.get(c.id)||{}),status:c.status}));
    g.open.sort((a,b)=>(b.status==="blocked")-(a.status==="blocked")||(a.due||"9").localeCompare(b.due||"9"));
    g.blockedKids=g.open.filter(o=>o.status==="blocked").length;
    g.lateKids=g.open.filter(o=>o.due&&o.due<TODAY).length;
    g.attention=g.late||g.blockedKids>0||g.lateKids>0;
  }
  const rootOf=g=>{const seen=new Set();let x=g;while(x.openParents.length&&!seen.has(x.id)){seen.add(x.id);x=gById.get(x.openParents[0].id)||x;if(seen.has(x.id))break}return x};
  const projects=goals.filter(g=>g.due).sort((a,b)=>a.due.localeCompare(b.due));
  const roots=goals.filter(g=>!g.openParents.length);
  const subtree=g=>{const seen=new Set();const walk=x=>{for(const c of x.children){if(seen.has(c.id))continue;seen.add(c.id);const cg=gById.get(c.id);if(cg)walk(cg)}};walk(g);return [...seen].map(id=>byId.get(id)).filter(Boolean)};
  const themes=roots.map(g=>{
    const items=subtree(g);
    const projs=projects.filter(p=>rootOf(p).id===g.id);
    const tasks=items.filter(i=>!CLOSED.has(i.status)&&!goalIds.has(i.id)).map(i=>({...i,...(byId.get(i.id)||{})}));
    const attn=tasks.filter(o=>o.status==="blocked"||(o.due&&o.due<TODAY));
    return{...g,items,openItems:items.filter(i=>!CLOSED.has(i.status)),projs,tasks,attn,warn:attn.length>0||projs.some(p=>p.attention)};
  }).sort((a,b)=>b.projs.length-a.projs.length||b.tasks.length-a.tasks.length);
  const tasks=open.filter(b=>!goalIds.has(b.id));
  const unfiled=tasks.filter(b=>!filed.has(b.id));

  const people=new Map();
  for(const b of open){
    const who=b.assignee&&b.assignee!=="unassigned"&&b.assignee!=="—"?b.assignee:"Unassigned";
    const p=people.get(who)||{name:who,items:[],late:0,blocked:0,inprog:0};
    p.items.push(b); if(b.due&&b.due<TODAY)p.late++; if(b.status==="blocked")p.blocked++; if(b.status==="in_progress")p.inprog++;
    people.set(who,p);
  }
  const closeCands=goals.filter(g=>g.total>0&&g.closed===g.total).map(g=>({...g,evidence:`All ${g.total} child pact${g.total>1?"s":""} are closed: `+g.children.map(c=>`${c.id} (${c.status})`).join(", ")+"."}));

  let feed=null;
  if(history){
    feed=history.filter(h=>h.timestamp).map(h=>({...h,title:(byId.get((h.bead_id||"").replace("BEAD-","PACT-"))||{}).title||""}));
  }
  const fallbackFeed=[];
  if(!history){ for(const g of goals) for(const n of g.notes||[]) fallbackFeed.push({bead_id:g.id,action:"note",timestamp:n.date,changed_by:n.who,reason:n.text,title:g.title,changes:{}}); fallbackFeed.sort((a,b)=>b.timestamp.localeCompare(a.timestamp)); }

  const res=new Map();
  const R=n=>{if(!n||n==="unassigned"||n==="—")return null;if(!res.has(n))res.set(n,{name:n,responsible:[],accountable:[],tasks:[],stuck:0});return res.get(n)};
  for(const g of goals){R(g.assignee)?.responsible.push(g);R(g.approver)?.accountable.push(g)}
  for(const t of tasks){const r=R(t.assignee);if(r){r.tasks.push(t);if(t.status==="blocked"||(t.due&&t.due<TODAY))r.stuck++}}
  const resources=[...res.values()].sort((a,b)=>(b.responsible.length+b.tasks.length)-(a.responsible.length+a.tasks.length));
  for(const r of resources) r.tasks.sort((a,b)=>(a.due||"9").localeCompare(b.due||"9"));

  return {project,goals,gById,open,doneGoals,projects,themes,tasks,unfiled,resources,people:[...people.values()].sort((a,b)=>b.items.length-a.items.length),closeCands,feed,fallbackFeed,historyErr,storedAt,byId};
}

function describe(h){

  const keys=Object.keys(c); return keys.length?"changed "+keys.join(", "):h.action||"change";
}
function activityHTML(d){
  let h="";
  h+=`<div class="box"><div class="box-h"><h2>Ready to close</h2><span class="dim">${d.closeCands.length}</span></div>`;
  h+= d.closeCands.length? d.closeCands.map(g=>`<div class="cl"><div><div class="t" data-id="${esc(g.id)}"><span class="mono dim">${esc(g.id)}</span> ${esc(g.title)}</div><div class="ev">${esc(g.evidence)}</div></div><button class="btn pri" data-approve="${esc(g.id)}" type="button">Approve</button></div>`).join("")
    : `<div class="empty">No open goal has all of its children closed.</div>`;

function inlineMd(t){
  let h=esc(unent(t));
  h=h.replace(/`([^`]+)`/g,'<code>$1</code>');
  h=h.replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
  h=h.replace(/(^|[\s(])_([^_]+)_(?=[\s).,]|$)/g,'$1<i>$2</i>');
  h=h.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  h=h.replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g,'$1<a href="$2" target="_blank" rel="noopener">$2</a>');
  return h;
}
function blockMd(text){
  const out=[]; let list=null, para=[];
  const flushP=()=>{if(para.length){out.push(`<p>${para.map(inlineMd).join("<br>")}</p>`);para=[]}};
  const flushL=()=>{if(list){out.push(`<${list.tag}>${list.items.map(i=>`<li>${inlineMd(i)}</li>`).join("")}</${list.tag}>`);list=null}};
  for(const raw of String(text).split("\n")){
    const l=raw.trimEnd(); let m;
    if(!l.trim()){flushP();flushL();continue}
    if((m=l.match(/^#{1,6}\s+(.*)/))){flushP();flushL();out.push(`<h4>${inlineMd(m[1])}</h4>`);continue}
    if((m=l.match(/^\s*[-*•]\s+(.*)/))){flushP();if(!list||list.tag!=="ul"){flushL();list={tag:"ul",items:[]}}list.items.push(m[1]);continue}
    if((m=l.match(/^\s*\d+[.)]\s+(.*)/))){flushP();if(!list||list.tag!=="ol"){flushL();list={tag:"ol",items:[]}}list.items.push(m[1]);continue}
    if(list&&/^\s{2,}\S/.test(raw)){list.items[list.items.length-1]+=" "+l.trim();continue}
    flushL();para.push(l);
  }
  flushP();flushL();
  return out.join("");
}
function beadHTML(text){
  const t=String(text||"");
  if(!/^## \[/m.test(t)) return `<div class="dbox">${blockMd(t)}</div>`;
  const lines=t.split("\n");
  const fields=[], parts={c:[],p:[]}; let mode=null, i=1;
  for(;i<lines.length;i++){
    const l=lines[i];
    if(/^###\s/.test(l)) break;
    let m;
    if(/^- \*\*⬆ Blocked by/.test(l)){mode="c";continue}
    if(/^- \*\*⬇ Blocking/.test(l)){mode="p";continue}
    if((m=l.match(CHILD))&&mode){parts[mode].push({id:m[1],alias:m[2]||"",title:unent(m[3]),status:m[4]});continue}
    if((m=l.match(/^- \*\*(.+?)\*\*:\s*(.*)$/))){mode=null;fields.push([m[1],m[2]]);continue}
  }
  const sections=[]; let cur=null;
  for(;i<lines.length;i++){
    const m=lines[i].match(/^###\s+(.*)/);
    if(m){cur={title:m[1],body:[]};sections.push(cur);continue}
    if(cur) cur.body.push(lines[i]);
  }
  const f=Object.fromEntries(fields.map(([k,v])=>[k.toLowerCase(),v]));
  const stat=(f.status||"").replace(/^\S+\s+/,"");
  const chips=[stat?chipSt(stat):"",f.priority?`<span class="chip">${esc(f.priority)} priority</span>`:"",f.assignee?`<span class="chip">R: ${esc(f.assignee)}</span>`:"",f.approver?`<span class="chip">A: ${esc(f.approver)}</span>`:"",f.due?`<span class="chip ${f.due<TODAY&&!CLOSED.has(stat)?"late":""}">due ${esc(fmtDay(f.due))}</span>`:""].join("");
  const known=new Set(["status","priority","assignee","approver","due"]);
  const extra=fields.filter(([k])=>!known.has(k.toLowerCase()));
  const kids=parts.c, done=kids.filter(k=>CLOSED.has(k.status)).length;
  const linkRows=xs=>`<div class="box">${xs.map(x=>rowHTML(x,"")).join("")}</div>`;
  let h=`<div class="chips">${chips}</div>`;
  if(extra.length) h+=`<div class="meta">${extra.map(([k,v])=>`<span><span class="dim">${esc(k)}:</span> ${inlineMd(v)}</span>`).join("")}</div>`;
  if(kids.length) h+=`<h3>Depends on · ${done}/${kids.length} closed</h3><div class="pbar"><i style="width:${done/kids.length*100}%"></i></div>${linkRows(kids.slice().sort((a,b)=>CLOSED.has(a.status)-CLOSED.has(b.status)))}`;
  if(parts.p.length) h+=`<h3>Part of</h3>${linkRows(parts.p)}`;
  for(const sec of sections){
    const body=sec.body.join("\n").trim();
    if(/^notes/i.test(sec.title)){
      const notes=splitNotes(body).map(n=>[null,n.date,n.who,n.text]);
      const more=(body.match(/_…\s*and (\d+) older/)||[])[1];
      h+=`<h3>${esc(sec.title)}</h3><div class="box">${notes.map(n=>`<div class="nt"><div class="spread"><span class="who">${esc(short(n[2]))}</span><span class="who">${esc(fmtDay(n[1]))}</span></div><div class="md">${blockMd(n[3].trim())}</div></div>`).join("")||'<div class="empty">No notes.</div>'}${more?`<div class="empty">${esc(more)} older note${more==="1"?"":"s"} not shown.</div>`:""}</div>`;
    } else if(body){
      h+=`<h3>${esc(sec.title.replace(/^Description \/ /,""))}</h3><div class="dbox md">${blockMd(body)}</div>`;
    }
  }
  return h;
}

    ${taskList(u)}`);
}
function closeDrawer(){$("#dr").classList.remove("on");$("#scrim").classList.remove("on")}

/* ---------- approve close ---------- */
async function approve(btn){
  const id=btn.dataset.approve;
  if(!btn.classList.contains("arm")){btn.classList.add("arm");btn.textContent="Confirm close";setTimeout(()=>{if(btn.isConnected&&!btn.disabled){btn.classList.remove("arm");btn.textContent="Approve"}},5000);return}
  btn.disabled=true; btn.textContent="Closing…";
  const g=data.closeCands.find(x=>x.id===id); const server=PROJECTS[state.project].server;
  try{
    await mcp.callTool(server,"add_note",{bead_id:id,text:`Close approved from the harness artifact. Evidence: ${g.evidence}`});
    await mcp.callTool(server,"update_status",{bead_id:id,status:"done",reason:`Closed from the harness: ${g.evidence}`});
    btn.textContent="Closed ✓";
    await mcp.invalidate(server).catch(()=>{});
    load(true);
  }catch(e){
    btn.disabled=false; btn.classList.remove("arm"); btn.textContent="Approve";
    $("#note").innerHTML=`<div class="banner err">Couldn't close ${esc(id)}: ${esc(errText(e,server))}</div>`;
  }
}

/* ---------- wiring ---------- */
$("#proj").innerHTML=Object.entries(PROJECTS).map(([k,p])=>`<button type="button" data-proj="${k}" aria-pressed="${state.project===k}">${esc(p.label)}</button>`).join("");
document.addEventListener("click",e=>{
  if(e.target.id==="scrim"||e.target.closest("[data-close]")) return closeDrawer();
  const o=e.target.closest("[data-open]");
  if(o&&data){const v=o.dataset.open,i=v.indexOf(":"),k=v.slice(0,i),id=v.slice(i+1);({proj:openProject,theme:openTheme,person:openPerson,unfiled:openUnfiled,src:openSource})[k]?.(id);return}
  const t=e.target.closest("[data-proj],[data-tab],[data-approve],[data-ask],[data-notify],[data-send],[data-id]");
  if(!t) return;
  if(t.dataset.proj){ if(t.dataset.proj===state.project) return; state.project=t.dataset.proj; store.set("hs.project",state.project); document.querySelectorAll("[data-proj]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.proj===state.project)); data=null; if(mcp) load(false); return; }
  if(t.dataset.tab){ state.tab=t.dataset.tab; store.set("hs.tab",state.tab); render(); return; }
  if(t.dataset.approve){ approve(t); return; }
  if(t.dataset.ask!==undefined){ askClaude(t); return; }
  if(t.dataset.notify!==undefined){ openNotify(+t.dataset.notify); return; }
  if(t.dataset.send){ sendNotify(t); return; }
  if(t.dataset.id){ openDrawer(t.dataset.id); }
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape") closeDrawer();
  if((e.key==="Enter"||e.key===" ")&&e.target.matches(".row[data-id],.row[data-open]")){e.preventDefault();e.target.click()}
});
document.addEventListener("change",e=>{ if(e.target.id==="mepick"&&data){ store.set("hs.me."+data.project,e.target.value); data.myday=myDay(data,null); if(!e.target.value) data.myday.me=null; render(); } });
$("#refresh").onclick=()=>{ if(mcp) load(true); };

(async()=>{
  mcp = window.claude ? await window.claude.use("mcp") : null;
  if(!mcp){ $("#fresh").textContent=""; $("#panel").innerHTML='<div class="banner err">Open this page in claude.ai with your Pact connectors to see live data.</div>'; return; }
  load(false);
})();
</script>
