  <text x="470" y="65" text-anchor="middle" font-size="11.5" fill="#6b6b6b">R: Will · A: Max · due Jun 27 · at risk</text>

  <!-- Speed gate -->
  <rect x="34" y="146" width="260" height="58" rx="9" fill="#ffffff" stroke="#3a9e5c" stroke-width="2"/>
