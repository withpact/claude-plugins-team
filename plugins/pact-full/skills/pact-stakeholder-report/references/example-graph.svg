<svg viewBox="0 0 940 540" width="940" height="540" xmlns="http://www.w3.org/2000/svg" role="img" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <title>North Star dependency graph, grouped by gate</title>
  <desc>North Star (0487) depends on the Speed gate (closed), the Overwhelm gate (blocked on a decision), and unstarted claim-resolution actions. Arrows point to what a bead blocks.</desc>
  <rect x="0" y="0" width="940" height="540" fill="#ffffff"/>
  <defs>
    <marker id="arr2" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#6b6b6b"/>
    </marker>
  </defs>

  <!-- group containers -->
  <rect x="20" y="130" width="288" height="232" rx="12" fill="#f1f8f3"/>
  <rect x="326" y="130" width="288" height="316" rx="12" fill="#fdf0ef"/>
  <rect x="632" y="130" width="288" height="272" rx="12" fill="#fdf0ef"/>

  <!-- edges: groups block North Star -->
  <line x1="164" y1="138" x2="395" y2="78" stroke="#6b6b6b" stroke-width="1.5" marker-end="url(#arr2)"/>
  <line x1="470" y1="138" x2="470" y2="80" stroke="#6b6b6b" stroke-width="1.5" marker-end="url(#arr2)"/>
  <line x1="776" y1="138" x2="545" y2="78" stroke="#6b6b6b" stroke-width="1.5" marker-end="url(#arr2)"/>
