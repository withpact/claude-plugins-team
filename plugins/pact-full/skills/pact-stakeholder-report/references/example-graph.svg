  <line x1="470" y1="236" x2="470" y2="206" stroke="#6b6b6b" stroke-width="1.4" marker-end="url(#arr2)"/>
  <line x1="776" y1="236" x2="776" y2="206" stroke="#6b6b6b" stroke-width="1.4" marker-end="url(#arr2)"/>

