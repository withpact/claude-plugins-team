  <text x="470" y="188" text-anchor="middle" font-size="10.5" fill="#d6453d">the blocker · overdue Jun 13</text>

  <!-- Claim-resolution -->
  <rect x="646" y="146" width="260" height="58" rx="9" fill="#ffffff" stroke="#d6453d" stroke-width="2"/>
  <text x="776" y="170" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">Claim-resolution</text>
  <text x="776" y="188" text-anchor="middle" font-size="10.5" fill="#d6453d">all unstarted · overdue Jun 9 · R: Yann</text>

